  --card: #FFFFFF;
  --card-2: #FAF8F2;
  --stripe: #FBF9F4;
  --border: rgba(27,42,74,0.09);
  --border-strong: rgba(27,42,74,0.16);
  --hover: rgba(27,42,74,0.03);
  --primary: #1B2A4A;
  --accent: #C9A227;
  --accent-2: #D9B84A;
  --primary-grad: linear-gradient(135deg, #1B2A4A 0%, #24365E 100%);
  --primary-glow: rgba(201,162,39,0.18);
  --primary-soft: rgba(27,42,74,0.07);
  --accent-soft: rgba(201,162,39,0.12);
  --success: #3F7F56;
  --success-soft: rgba(63,127,86,0.10);
  --warning: #A8721C;
  --warning-soft: rgba(168,114,28,0.12);
  --danger: #A23E35;
  --danger-soft: rgba(162,62,53,0.10);
  --text: #1B2A4A;
  --sub: #5B6478;
  --muted: #94A0B5;
  --primary-text: #1B2A4A;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  background-image: radial-gradient(circle at 20% 0%, var(--bg-grad-1), var(--bg-grad-2) 50%);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.3s, color 0.3s;
}
body::before, body::after {
  content: ''; position: fixed; border-radius: 50%;
  filter: blur(140px); opacity: 0.06; pointer-events: none; z-index: 0;
}
body::before { width: 600px; height: 600px; background: var(--primary); top: -200px; left: -100px; }
body::after { width: 500px; height: 500px; background: var(--accent); top: 40%; right: -150px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  position: relative;
  transition: transform 0.25s cubic-bezier(0.16,1,0.3,1), border-color 0.25s, box-shadow 0.25s;
}
.card-hover:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  box-shadow: 0 8px 24px rgba(0,0,0,0.22);
}

h1 {
  font-family: 'Cormorant Garamond', 'Inter', serif;
  font-weight: 700;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 18px; border-radius: 10px;
  font-size: 14px; font-weight: 600; font-family: inherit;
  cursor: pointer; border: none;
  transition: transform 0.18s cubic-bezier(0.16,1,0.3,1), box-shadow 0.18s, background 0.18s;
  position: relative; overflow: hidden; white-space: nowrap;
}
.btn-primary { background: var(--primary-grad); color: var(--accent-2); border: 1px solid var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.18); }
.btn-primary:hover { border-color: var(--accent-2); box-shadow: 0 4px 14px rgba(0,0,0,0.24); }
.btn-primary:active { transform: scale(0.98); }
.btn-ghost { background: var(--card); border: 1px solid var(--border); color: var(--text); }
.btn-ghost:hover { background: var(--hover); border-color: var(--border-strong); transform: translateY(-1px); }
.btn-danger { background: var(--danger); color: white; }
.btn-danger:hover { background: #DC2626; }

.kpi-icon {
  width: 44px; height: 44px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
}
.icon-primary { background: var(--primary-soft); color: var(--primary-text); }
.icon-accent { background: var(--accent-soft); color: var(--accent); }
.icon-success { background: var(--success-soft); color: var(--success); }
.icon-danger { background: var(--danger-soft); color: var(--danger); }
.kpi-value {
  font-size: 32px; font-weight: 800; letter-spacing: -0.02em;
  line-height: 1.1; color: var(--text);
}

.table { width: 100%; border-collapse: collapse; }
.table thead th {
  text-align: left; padding: 12px 14px;
  font-size: 11px; font-weight: 600; color: var(--sub);
  text-transform: uppercase; letter-spacing: 0.06em;
  background: var(--card-2); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 5; white-space: nowrap;
}
.table tbody tr:nth-child(odd)  { background: var(--card); }
.table tbody tr:nth-child(even) { background: var(--stripe); }
.table tbody tr {
  transition: background 0.15s;
  cursor: pointer;
}
.table tbody tr:hover { background: var(--hover); }
.table tbody td {
  padding: 14px; font-size: 14px;
  border-bottom: 1px solid var(--border);
}
.table tbody tr:first-child td:first-child { border-top-left-radius: 12px; }
.table tbody tr:first-child td:last-child { border-top-right-radius: 12px; }
.table tbody tr:last-child td:first-child { border-bottom-left-radius: 12px; }
.table tbody tr:last-child td:last-child { border-bottom-right-radius: 12px; }
.table tbody tr:last-child td { border-bottom: none; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 11px; border-radius: 999px;
  font-size: 12px; font-weight: 600; border: 1px solid; white-space: nowrap;
}
.chip::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%;
  background: currentColor; box-shadow: 0 0 8px currentColor;
}
.chip-success { background: var(--success-soft); color: var(--success); border-color: rgba(76,154,106,0.3); }
.chip-primary { background: var(--primary-soft); color: var(--primary-text); border-color: rgba(27,42,74,0.3); }
.chip-warning { background: var(--warning-soft); color: var(--warning); border-color: rgba(168,114,28,0.3); }
.chip-danger { background: var(--danger-soft); color: var(--danger); border-color: rgba(176,72,63,0.3); }
.chip-neutral { background: var(--hover); color: var(--sub); border-color: var(--border); }

.input {
  width: 100%; padding: 10px 14px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text);
  font-size: 16px; font-family: inherit; outline: none;
  transition: all 0.2s;
}
.input::placeholder { color: var(--muted); }
.input:focus { border-color: var(--primary-text); box-shadow: 0 0 0 3px var(--primary-soft); }
select.input {
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235B6478' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 10px center;
  background-size: 14px;
  padding-right: 30px;
  width: 100%;
  min-width: 0;
}
select.input option {
  background: var(--card);
  color: var(--text);
  padding: 10px 12px;
}
@media (max-width: 768px) {
  select.input {
    appearance: auto;
    -webkit-appearance: auto;
    -moz-appearance: auto;
    background-image: none !important;
    padding: 14px 12px !important;
    line-height: 1.5 !important;
    min-height: 44px !important;
    height: auto !important;
    font-size: 16px !important;
  }
}

.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(7,11,23,0.7);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  animation: fadeIn 0.15s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-content {
  background: var(--card); border: 1px solid var(--border-strong);
  border-radius: 24px; box-shadow: 0 24px 80px rgba(27,42,74,0.22);
  width: 100%; overflow: hidden;
  animation: modalIn 0.22s cubic-bezier(0.16,1,0.3,1);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.96) translateY(-12px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.cmd-backdrop {
  position: fixed; inset: 0;
  background: rgba(7,11,23,0.7); backdrop-filter: blur(8px);
  z-index: 100; display: flex; align-items: flex-start; justify-content: center;
  padding-top: 12vh; animation: fadeIn 0.15s ease-out;
}
.cmd-modal {
  width: 100%; max-width: 580px;
  background: var(--card); border: 1px solid var(--border-strong);
  border-radius: 16px; box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  overflow: hidden; animation: modalIn 0.22s cubic-bezier(0.16,1,0.3,1);
}
.cmd-result {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px; cursor: pointer; transition: background 0.15s;
}
.cmd-result:hover, .cmd-result.selected { background: var(--hover); }

@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.fade-up { animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both; }

@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); } 50% { box-shadow: 0 0 0 7px rgba(239,68,68,0); } }

.fab {
  position: fixed; bottom: calc(84px + env(safe-area-inset-bottom)); right: 20px;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--primary-grad); color: white; border: none; cursor: pointer;
  box-shadow: 0 12px 32px var(--primary-glow);
  display: flex; align-items: center; justify-content: center;
  z-index: 45; transition: transform 0.2s;
}
.fab:hover { transform: scale(1.08) rotate(90deg); }
.fab:active { transform: scale(0.95); }

.bottom-nav {
  position: fixed; left: 16px; right: 16px; z-index: 40;
  bottom: max(16px, env(safe-area-inset-bottom));
  background: rgba(255,255,255,0.72); border: 1px solid rgba(27,42,74,0.08);
  backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border-radius: 28px;
  padding: 8px;
  box-shadow: 0 8px 32px rgba(27,42,74,0.14);
  display: flex; gap: 8px; justify-content: center;
}
.nav-btn {
  flex: 1; max-width: 220px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 12px 20px; border-radius: 20px;
  font-size: 16px; font-weight: 700; cursor: pointer;
  border: none; transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
  color: var(--sub); background: transparent;
  font-family: inherit; position: relative; overflow: hidden;
}
.nav-btn:hover { color: var(--text); }
.nav-btn.active {
  background: var(--primary-grad); color: var(--accent-2); border-color: var(--accent);
  box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  transform: translateY(-2px);
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--sub); }
.tabular-nums { font-variant-numeric: tabular-nums; }
button, nav, aside { -webkit-user-select: none; user-select: none; }
.scroll-thin::-webkit-scrollbar { width: 6px; }
</style>
</head>

// HTML ESCAPE

function esc(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

const STORAGE_KEY = 'century-gate-orders';

function loadOrders() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try { state.orders = JSON.parse(stored); return; }
    catch (e) { console.warn('Failed to parse stored orders, re-seeding', e); }
  }
  state.orders = SEED_ORDERS.map(o => ({ ...o }));
  saveOrders();
}

function saveOrders() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.orders));
}

// CUSTOMER MASTER DATA (separate from orders — contact info, category, notes)
// ============================================================
const CUSTOMERS_STORAGE_KEY = 'century-gate-customers';

function loadCustomerMasters() {
  const stored = localStorage.getItem(CUSTOMERS_STORAGE_KEY);
  if (stored) {
    try { state.customers = JSON.parse(stored); return; }
    catch (e) { console.warn('Failed to parse stored customers, resetting', e); }
  }
  state.customers = [];
}

function saveCustomerMasters() {
  localStorage.setItem(CUSTOMERS_STORAGE_KEY, JSON.stringify(state.customers));
}

function getCustomerMaster(name) {
  return state.customers.find(c => c.customerName === name) || null;
}

function upsertCustomerMaster(data) {
  const idx = state.customers.findIndex(c => c.customerName === data.customerName);
  if (idx === -1) {
    state.customers.push(data);
  } else {
    state.customers[idx] = { ...state.customers[idx], ...data };
  }
  saveCustomerMasters();
}

// Merge order-derived stats (every customer that appears on an order) with
// optional master records (contact info / category / notes) keyed by name.
// A customer only needs to exist in orders to show up here — master data is
// an optional enrichment layer, not a prerequisite.
function getCustomerList() {
  const map = {};
  for (const o of state.orders) {
    const name = o.customerName || 'Unknown';
    if (!map[name]) {
      map[name] = {
        customerName: name, customerNumber: o.customerNumber || '',
        orders: 0, totalValue: 0, lastOrderDate: null, overdueCount: 0,
      };
    }
    map[name].orders++;
    map[name].totalValue += o.totalValue || 0;
    if (!map[name].customerNumber && o.customerNumber) map[name].customerNumber = o.customerNumber;
    if (!map[name].lastOrderDate || new Date(o.orderDate) > new Date(map[name].lastOrderDate)) map[name].lastOrderDate = o.orderDate;
    if (isOverdue(o.deadline, o.deliveryStatus)) map[name].overdueCount++;
  }
  let list = Object.values(map).map(c => {
    const master = getCustomerMaster(c.customerName) || {};
    return {
      ...c,
      avgOrder: c.orders > 0 ? c.totalValue / c.orders : 0,
      phone: master.phone || '', email: master.email || '', address: master.address || '',
      category: master.category || '', salesperson: master.salesperson || '', notes: master.notes || '',
    };
  });
  if (state.customerSearch) {
    const q = state.customerSearch.toLowerCase();
    list = list.filter(c => c.customerName.toLowerCase().includes(q) || (c.customerNumber || '').toLowerCase().includes(q) || (c.phone || '').toLowerCase().includes(q));
  }
  list.sort((a, b) => b.totalValue - a.totalValue);
  return list;
}

function getNextOrderId() {
  let maxN = 0;
  for (const o of state.orders) {
    const m = /^ORD-(\d+)$/i.exec(o.orderId || '');
    if (m) { const n = parseInt(m[1], 10); if (n > maxN) maxN = n; }
  }
  return 'ORD-' + String(maxN + 1).padStart(3, '0');
}

function createOrder(data) {
  const newOrder = { ...data };
  state.orders.unshift(newOrder);
  saveOrders();
  return newOrder;
}

function updateOrder(orderId, data) {
  const idx = state.orders.findIndex(o => o.orderId === orderId);
  if (idx === -1) return null;
  state.orders[idx] = { ...state.orders[idx], ...data };
  saveOrders();
  return state.orders[idx];
}

function deleteOrder(orderId) {
  state.orders = state.orders.filter(o => o.orderId !== orderId);
  saveOrders();
}

function getFilteredOrders() {
  let filtered = [...state.orders];
  if (state.search) {
    const q = state.search.toLowerCase();
    filtered = filtered.filter(o =>
      (o.orderId || '').toLowerCase().includes(q) ||
      (o.customerName || '').toLowerCase().includes(q) ||
      (o.customerNumber || '').toLowerCase().includes(q) ||
      (o.description || '').toLowerCase().includes(q) ||
      (o.productType || '').toLowerCase().includes(q)
    );
  }
  if (state.filterCustomer) filtered = filtered.filter(o => o.customerName === state.filterCustomer);
  if (state.filterProductType) filtered = filtered.filter(o => o.productType === state.filterProductType);
  if (state.filterOrderType) filtered = filtered.filter(o => (o.orderType || '').trim() === state.filterOrderType);
  if (state.filterProduction) filtered = filtered.filter(o => o.productionStatus === state.filterProduction);
  if (state.filterInvoice) filtered = filtered.filter(o => o.invoiceStatus === state.filterInvoice);
  if (state.filterDelivery) filtered = filtered.filter(o => o.deliveryStatus === state.filterDelivery);
  const sortMap = {
    orderId: 'orderId', orderDate: 'orderDate', customer: 'customerName',
    productType: 'productType', quantity: 'quantity', totalValue: 'totalValue',
    deadline: 'deadline', productionStatus: 'productionStatus',
    deliveryStatus: 'deliveryStatus', paymentStatus: 'paymentSummary',
  };
  const field = sortMap[state.sortBy] || 'orderDate';
  const dir = state.sortDir === 'asc' ? 1 : -1;
  filtered.sort((a, b) => {
    let av = a[field], bv = b[field];
    if (av == null) av = '';
    if (bv == null) bv = '';
    if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * dir;
    return String(av).localeCompare(String(bv)) * dir;
  });
  return filtered;
}

// ============================================================
// FORMATTERS
// ============================================================
function formatSAR(value, decimals = 2) {
  if (value == null || isNaN(value)) return '—';
  return 'SAR ' + Number(value).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function formatSARShort(value) {
  if (value == null || isNaN(value)) return '—';
  if (Math.abs(value) >= 1e6) return 'SAR ' + (value / 1e6).toFixed(2) + 'M';
  if (Math.abs(value) >= 1e3) return 'SAR ' + (value / 1e3).toFixed(1) + 'K';
  return 'SAR ' + value.toFixed(0);
}
function formatNumber(value, decimals = 0) {
  if (value == null || isNaN(value)) return '—';
  return Number(value).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}
function isOverdue(deadline, deliveryStatus) {
  if (!deadline) return false;
  if (deliveryStatus === 'Fully Delivered') return false;
  return new Date(deadline).getTime() < Date.now();
}

// ============================================================
// STATUS CHIP HELPERS
// ============================================================
function statusChipClass(value) {
  if (!value) return 'chip chip-neutral';
  const v = value.trim();
  const goodStatuses = ['Completed', 'Fully Delivered', 'Invoiced', 'Fully Paid', '50% Advance Paid'];
  const warnStatuses = ['In Progress', 'Partially Delivered'];
  const badStatuses = ['Not Shipped', 'No Payment'];
  const neutralStatuses = ['Pending', 'Not Invoiced', 'Reorder'];
  if (goodStatuses.includes(v)) return 'chip chip-success';
  if (warnStatuses.includes(v)) return 'chip chip-warning';
  if (badStatuses.includes(v)) return 'chip chip-danger';
  if (neutralStatuses.includes(v)) return 'chip chip-neutral';
  if (v === 'New Order') return 'chip chip-primary';
  return 'chip chip-neutral';
}
function statusChip(value) {
  if (!value) return '<span style="color:var(--muted)">—</span>';
  return '<span class="' + statusChipClass(value) + '">' + esc(value) + '</span>';
}
function productChip(value) {
  if (!value) return '<span style="color:var(--muted)">—</span>';
  const meta = productMeta(value);
  return '<span class="chip" style="background: ' + meta.bg + '; color: ' + meta.fg + '; border-color: ' + meta.bd + '"><i data-lucide="' + meta.icon + '" class="w-3 h-3"></i>' + esc(value) + '</span>';
}

// ============================================================
// PRODUCT TYPE METADATA — icon + color per product type
// ============================================================
function productMeta(productType) {
  const v = (productType || '').trim();
  const map = {
    'Printed Paper Bags': { icon: 'shopping-bag', color: '#1B2A4A' },
    'Printed Boxes':      { icon: 'package',      color: '#6B4A5E' },
    'Printed Cups':       { icon: 'coffee',       color: '#8B7355' },
    'Printed Napkins':    { icon: 'sticky-note',  color: '#C9A227' },
    'Printed Sheet':      { icon: 'file-text',    color: '#2F5D62' },
    'Plain Items':        { icon: 'circle',       color: '#746E63' },
  };
  const m = map[v] || { icon: 'tag', color: '#746E63' };
  const hex = m.color.replace('#', '');
  const r = parseInt(hex.slice(0,2), 16), g = parseInt(hex.slice(2,4), 16), b = parseInt(hex.slice(4,6), 16);
  return {
    icon: m.icon,
    color: m.color,
    fg: m.color,
    bg: 'rgba(' + r + ',' + g + ',' + b + ',0.12)',
    bd: 'rgba(' + r + ',' + g + ',' + b + ',0.28)',
  };
}

// ============================================================
// TOAST
// ============================================================
function toast(title, description, variant) {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  const isErr = variant === 'destructive';
  el.style.cssText = 'background: var(--card); border: 1px solid var(--border-strong); border-radius: 12px; padding: 12px 18px; color: var(--text); font-size: 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.18); display: flex; align-items: center; gap: 10px; pointer-events: auto; min-width: 280px; opacity: 0; transform: translateY(20px); transition: all 0.3s cubic-bezier(0.16,1,0.3,1);';
  if (isErr) el.style.borderColor = 'var(--danger)';
  el.innerHTML = '<div class="kpi-icon ' + (isErr ? 'icon-danger' : 'icon-success') + '" style="width:28px;height:28px;flex-shrink:0;"><i data-lucide="' + (isErr ? 'alert-circle' : 'check-circle') + '" class="w-4 h-4"></i></div><div><div style="font-weight:600;font-size:14px;">' + esc(title) + '</div>' + (description ? '<div style="font-size:12px;color:var(--sub);margin-top:2px;">' + esc(description) + '</div>' : '') + '</div>';
  container.appendChild(el);
  if (window.lucide) lucide.createIcons();
  requestAnimationFrame(() => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; });
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(20px)'; setTimeout(() => el.remove(), 300); }, 3500);
}

// ============================================================
// RENDER — main entry point
// ============================================================
function render() {
  const activeEl = document.activeElement;
  const focusId = activeEl && activeEl.id ? activeEl.id : null;
  const focusName = activeEl && activeEl.name ? activeEl.name : null;
  const selectionStart = activeEl && activeEl.selectionStart != null ? activeEl.selectionStart : null;
  const selectionEnd = activeEl && activeEl.selectionEnd != null ? activeEl.selectionEnd : null;
  const scrollY = window.scrollY;

  requestAnimationFrame(() => {
    const app = document.getElementById('app');
    const viewChanged = (app.dataset.view || '') !== state.view;
    const shellExists = document.getElementById('main-content') !== null;

    if (viewChanged || !shellExists) {
      // FULL SHELL REBUILD — only on view switch or first load.
      app.innerHTML = renderShell();
      app.dataset.view = state.view;
      renderMainContent();
      renderModals();
      if (window.lucide) lucide.createIcons();
    } else {
      // PARTIAL UPDATE — only re-render content + modals. Topbar/bottom-nav persist untouched.
      renderMainContent();
      renderModals();
      if (window.lucide) lucide.createIcons();
    }

    attachEventListeners();

    if (focusId) {
      const restored = document.getElementById(focusId);
      if (restored) {
        restored.focus();
        if (selectionStart != null && selectionEnd != null) {
          try { restored.setSelectionRange(selectionStart, selectionEnd); } catch (e) {}
        }
      }
    } else if (focusName) {
      const restored = document.querySelector('[name="' + focusName + '"]');
      if (restored) {
        restored.focus();
        if (selectionStart != null && selectionEnd != null) {
          try { restored.setSelectionRange(selectionStart, selectionEnd); } catch (e) {}
        }
      }
    }
    window.scrollTo(0, scrollY);
  });
}

function filterSelect(label, stateKey, options) {
  const currentVal = state[stateKey];
  return `
    <div class="space-y-1.5">
      <label class="text-[11px] uppercase tracking-wide font-medium" style="color: var(--sub);">${label}</label>
      <select onchange="setFilter('${stateKey}', this.value)" class="input h-9">
        <option value="">All</option>
        ${options.map(o => '<option value="' + o.replace(/"/g, '&quot;') + '"' + (o === currentVal ? ' selected' : '') + '>' + esc(o) + '</option>').join('')}
      </select>
    </div>
  `;
}

function customerInitials(name) {
  const parts = (name || '?').trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function renderCustomerFormModal() {
  if (!state.customerFormMode) return '';
  const master = getCustomerMaster(state.customerFormName) || {};

  function inputField(label, name, value, placeholder) {
    return '<div class="space-y-1.5"><label class="text-xs font-medium" style="color: var(--text);">' + label + '</label><input name="' + name + '" type="text" value="' + (value != null ? String(value).replace(/"/g, '&quot;') : '') + '" placeholder="' + (placeholder || '') + '" class="input"></div>';
  }

  return `
    <div class="modal-backdrop" role="dialog" aria-modal="true" onclick="if(event.target===this)closeCustomerForm()">
      <div class="modal-content max-w-2xl max-h-[92vh] overflow-y-auto scroll-thin">
        <div class="p-6 border-b" style="border-color: var(--border);">
          <h2 class="text-xl font-bold" style="color: var(--text);">Edit Customer \u2014 ${esc(state.customerFormName)}</h2>
          <p class="text-sm mt-1" style="color: var(--sub);">Contact details are stored separately from orders and won't affect order records.</p>
        </div>
        <form id="customer-form" class="p-6 space-y-4" onsubmit="return false">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            ${inputField('Phone', 'phone', master.phone, 'e.g., 05XXXXXXXX')}
            ${inputField('Email', 'email', master.email, 'name@company.com')}
            ${inputField('Category', 'category', master.category, 'e.g., F&B, Retail, Distributor')}
            ${inputField('Salesperson', 'salesperson', master.salesperson, 'Assigned salesperson')}
          </div>
          ${inputField('Address', 'address', master.address, 'Street, city')}
          <div class="space-y-1.5">
            <label class="text-xs font-medium" style="color: var(--text);">Notes</label>
            <textarea name="notes" rows="3" class="input" placeholder="Internal notes about this customer">${esc(master.notes) || ''}</textarea>
          </div>
        </form>
        <div class="p-6 border-t flex gap-2" style="border-color: var(--border); background: var(--hover);">
          <button onclick="closeCustomerForm()" class="btn btn-ghost">Cancel</button>
          <button onclick="saveCustomerForm()" class="btn btn-primary"><i data-lucide="save" class="w-4 h-4"></i> Save Changes</button>
        </div>
      </div>
    </div>
  `;
}

function openCustomerDetail(name) {
  state.selectedCustomerName = name;
  render();
}
function closeCustomerDetail() {
  state.selectedCustomerName = null;
  render();
}
function openCustomerEditForm(name) {
  state.customerFormMode = 'edit';
  state.customerFormName = name;
  state.selectedCustomerName = null;
  render();
}
function closeCustomerForm() {
  if (document.activeElement) document.activeElement.blur();
  state.customerFormMode = null;
  state.customerFormName = null;
  render();
}
function saveCustomerForm() {
  const formEl = document.getElementById('customer-form');
  const fd = new FormData(formEl);
  const data = { customerName: state.customerFormName };
  for (const [key, value] of fd.entries()) { data[key] = value.trim(); }
  upsertCustomerMaster(data);
  toast('Customer updated', data.customerName + ' contact info saved.');
  state.customerFormMode = null;
  state.selectedCustomerName = data.customerName;
  render();
}

function renderOrderDetailModal() {
  if (!state.selectedOrderId) return '';
  const order = state.orders.find(o => o.orderId === state.selectedOrderId);
  if (!order) return '';

  const leadTime = (order.orderDate && order.deadline) ? Math.round((new Date(order.deadline) - new Date(order.orderDate)) / 86400000) : null;
  const overdue = isOverdue(order.deadline, order.deliveryStatus);

  function field(label, value) {
    return '<div class="space-y-1"><dt class="text-[11px] uppercase tracking-wide font-medium" style="color: var(--sub);">' + label + '</dt><dd class="text-sm font-medium" style="color: var(--text);">' + (value == null || value === '' ? '<span style="color:var(--muted);">\u2014</span>' : value) + '</dd></div>';
  }
  function coloredField(label, value, color, icon) {
    const valHtml = (value == null || value === '') ? '<span style="color:var(--muted);">\u2014</span>' : value;
    return '<div class="space-y-1"><dt class="text-[11px] uppercase tracking-wide font-medium flex items-center gap-1.5" style="color: ' + color + ';">' + (icon ? '<i data-lucide="' + icon + '" class="w-3 h-3"></i>' : '') + label + '</dt><dd class="text-sm font-bold" style="color: ' + color + ';">' + valHtml + '</dd></div>';
  }

  return `
    <div class="modal-backdrop" role="dialog" aria-modal="true" onclick="if(event.target===this)closeOrderDetail()">
      <div class="modal-content max-w-3xl max-h-[90vh] overflow-y-auto scroll-thin">
        <div class="p-6 border-b" style="border-color: var(--border);">
          <div class="flex items-center gap-3 mb-1">
            <span class="font-mono text-xl font-bold" style="color: var(--primary-text);">${esc(order.orderId)}</span>
            ${statusChip(order.productionStatus)}
          </div>
          <p class="text-sm" style="color: var(--sub);">${esc(order.customerName) || 'Unknown customer'} · ${esc(order.description) || '\u2014'}</p>
        </div>
        <div class="p-6 space-y-5">
          ${overdue ? '<div class="flex items-center gap-2 p-3 rounded-lg" style="background: var(--danger-soft); border: 1px solid rgba(239,68,68,0.25);"><i data-lucide="alert-triangle" class="w-4 h-4 shrink-0" style="color: var(--danger);"></i><p class="text-sm" style="color: var(--danger);">This order is past its deadline and not yet delivered.</p></div>' : ''}

// ============================================================
// NUMERIC HELPERS
// ============================================================
function sanitizeDecimal(value) {
  let cleaned = value.replace(/[^0-9.]/g, '');
  const parts = cleaned.split('.');
  if (parts.length > 2) cleaned = parts[0] + '.' + parts.slice(1).join('');
  return cleaned;
}
function numericKeyDown(e, currentValue) {
  if (e.metaKey || e.ctrlKey) return true;
  if (/^\d$/.test(e.key)) return true;
  if (e.key === '.' && !currentValue.includes('.')) return true;
  if (['Backspace', 'Delete', 'Tab', 'Escape', 'Enter', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(e.key)) return true;
  e.preventDefault();
  return false;
}
function recalcTotalValue() {
  const formEl = document.getElementById('order-form');
  if (!formEl) return;
  const qtyInput = formEl.querySelector('[name="quantity"]');
  const priceInput = formEl.querySelector('[name="unitPrice"]');
  const clicheInput = formEl.querySelector('[name="clicheValue"]');
  const totalInput = formEl.querySelector('[name="totalValue"]');
  if (!qtyInput || !priceInput || !totalInput) return;
  const qty = parseFloat(qtyInput.value) || 0;
  const price = parseFloat(priceInput.value) || 0;
  const cliche = clicheInput ? (parseFloat(clicheInput.value) || 0) : 0;
  if (qtyInput.value !== '' && priceInput.value !== '') {
    totalInput.value = (qty * price + cliche).toFixed(2);
  }
}

// ============================================================
// EVENT HANDLERS
// ============================================================
function setView(view) {
  state.view = view;
  state.page = 1;
  render();
}

function setFilter(key, value) {
  state[key] = value;
  state.page = 1;
  render();
}

function clearFilters() {
  state.filterCustomer = ''; state.filterProductType = ''; state.filterOrderType = '';
  state.filterProduction = ''; state.filterInvoice = ''; state.filterDelivery = '';
  state.page = 1;
  render();
}

function toggleFilters() {
  state.showFilters = !state.showFilters;
  render();
}

function toggleSort(field) {
  if (state.sortBy === field) {
    state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    state.sortBy = field;
    state.sortDir = 'asc';
  }
  render();
}

function changePage(delta) {
  state.page += delta;
  if (state.page < 1) state.page = 1;
  render();
}

function goToOrdersWithCustomer(customer) {
  state.view = 'orders';
  state.filterCustomer = customer;
  state.showFilters = true;
  state.page = 1;
  render();
}

function openOrderDetail(orderId) {
  state.selectedOrderId = orderId;
  render();
}

function closeOrderDetail() {
  state.selectedOrderId = null;
  render();
}

function openCreateForm() {
  state.formMode = 'create';
  state.formOrderId = null;
  state.selectedOrderId = null;
  render();
}

function openEditForm(orderId) {
  state.formMode = 'edit';
  state.formOrderId = orderId;
  state.selectedOrderId = null;
  render();
}

function closeForm() {
  if (document.activeElement) document.activeElement.blur();
  state.formMode = null;
  state.formOrderId = null;
  render();
}

function saveForm() {
  const formEl = document.getElementById('order-form');
  const fd = new FormData(formEl);
  const data = {};
  for (const [key, value] of fd.entries()) { data[key] = value.trim(); }

  if (!data.orderId) { toast('Please fix the errors', 'Order ID is required', 'destructive'); return; }
  if (!data.customerName) { toast('Please fix the errors', 'Customer name is required', 'destructive'); return; }

  if (state.formMode === 'create') {
    if (state.orders.find(o => o.orderId === data.orderId)) {
      toast('Failed to create order', 'Order ID "' + data.orderId + '" already exists', 'destructive');
      return;
    }
  }

  ['quantity', 'unitPrice', 'clicheValue', 'totalValue', 'remainingQty'].forEach(k => {
    data[k] = data[k] === '' ? null : Number(data[k]);
  });
  ['orderDate', 'deadline'].forEach(k => { data[k] = data[k] || null; });

  if (data.totalValue == null && data.quantity != null && data.unitPrice != null) {
    data.totalValue = data.quantity * data.unitPrice + (data.clicheValue || 0);
  }

  if (state.formMode === 'create') {
    createOrder(data);
    toast('Order created', data.orderId + ' has been added.');
  } else {
    if (data.orderId !== state.formOrderId) {
      if (state.orders.find(o => o.orderId === data.orderId)) {
        toast('Failed to update order', 'Order ID "' + data.orderId + '" already exists', 'destructive');
        return;
      }
    }
    updateOrder(state.formOrderId, data);
    toast('Order updated', data.orderId + ' has been saved.');
  }
  closeForm();
}

function confirmDeleteOrder(orderId) {
  const container = document.createElement('div');
  container.className = 'modal-backdrop';
  container.setAttribute('role', 'dialog');
  container.setAttribute('aria-modal', 'true');
  container.style.zIndex = '110';
  container.innerHTML = `
    <div class="modal-content max-w-md w-full p-6">
      <div class="flex items-center gap-3 mb-3">
        <div class="kpi-icon icon-danger shrink-0"><i data-lucide="alert-triangle" class="w-5 h-5"></i></div>
        <h3 class="text-lg font-bold" style="color: var(--text);">Delete this order?</h3>
      </div>
      <p class="text-sm mb-5" style="color: var(--sub);">
        You are about to permanently delete order
        <span class="font-mono font-semibold" style="color: var(--text);">${esc(orderId)}</span>.
        This action cannot be undone.
      </p>
      <div class="flex gap-2 justify-end">
        <button id="delete-cancel" class="btn btn-ghost">Cancel</button>
        <button id="delete-confirm" class="btn btn-danger"><i data-lucide="trash-2" class="w-4 h-4"></i> Delete Order</button>
      </div>
    </div>
  `;
  document.body.appendChild(container);
  if (window.lucide) lucide.createIcons();

  container.addEventListener('click', (e) => { if (e.target === container) container.remove(); });

}

// ============================================================
// COMMAND PALETTE (Ctrl+K)
// ============================================================
function openCmdPalette() {
  const backdrop = document.getElementById('cmd-backdrop');
  backdrop.style.display = 'flex';
  renderCmdResults('');
  setTimeout(() => document.getElementById('cmd-input').focus(), 50);
}

function closeCmdPalette() {
  document.getElementById('cmd-backdrop').style.display = 'none';
  const input = document.getElementById('cmd-input');
  if (input) input.value = '';
}

function renderCmdResults(query) {
  const container = document.getElementById('cmd-results');
  const q = (query || '').toLowerCase().trim();
  let html = '';
  let actions = [];

  actions.push({ icon: 'plus', label: 'Create new order', desc: 'Open the order form', action: () => { closeCmdPalette(); openCreateForm(); } });
  actions.push({ icon: 'file-text', label: 'Export orders to PDF', desc: 'Download filtered orders as PDF', action: () => { closeCmdPalette(); exportPDF(); } });
  actions.push({ icon: 'filter', label: 'Toggle filters', desc: 'Show/hide the filter panel', action: () => { closeCmdPalette(); if (state.view !== 'orders') setView('orders'); else toggleFilters(); } });
  actions.push({ icon: 'clipboard-list', label: 'Go to Orders', desc: 'Switch to orders view', action: () => { closeCmdPalette(); setView('orders'); } });
  actions.push({ icon: 'users', label: 'Go to Customers', desc: 'Switch to customers view', action: () => { closeCmdPalette(); setView('customers'); } });

  let filteredActions = q ? actions.filter(a => a.label.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q)) : actions;
  let orderResults = [];
  if (q) {
    orderResults = state.orders.filter(o =>
      (o.orderId || '').toLowerCase().includes(q) ||
      (o.customerName || '').toLowerCase().includes(q) ||
      (o.description || '').toLowerCase().includes(q)
    ).slice(0, 8);
  } else {
    orderResults = [...state.orders].sort((a, b) => new Date(b.orderDate || 0) - new Date(a.orderDate || 0)).slice(0, 5);
  }

  state.cmdSelectedIndex = 0;
  let allItems = [];

  if (filteredActions.length > 0) {
    html += '<p class="px-5 py-1 text-[10px] uppercase tracking-wider font-semibold" style="color: var(--muted);">Quick actions</p>';
    filteredActions.forEach((a, i) => {
      allItems.push({ type: 'action', data: a });
      html += `<div class="cmd-result ${i === 0 && !q ? 'selected' : ''}" data-idx="${allItems.length - 1}"><div class="kpi-icon icon-primary shrink-0" style="width:32px;height:32px;"><i data-lucide="${a.icon}" class="w-4 h-4"></i></div><div class="flex-1"><div class="text-sm font-semibold" style="color: var(--text);">${a.label}</div><div class="text-xs" style="color: var(--sub);">${a.desc}</div></div></div>`;
    });
  }

  if (orderResults.length > 0) {
    html += '<p class="px-5 py-1 mt-2 text-[10px] uppercase tracking-wider font-semibold" style="color: var(--muted);">Orders</p>';
    orderResults.forEach((o) => {
      allItems.push({ type: 'order', data: o });
      html += `<div class="cmd-result" data-idx="${allItems.length - 1}"><div class="kpi-icon icon-accent shrink-0" style="width:32px;height:32px;"><i data-lucide="clipboard-list" class="w-4 h-4"></i></div><div class="flex-1"><div class="text-sm font-semibold" style="color: var(--text);">${esc(o.orderId)} \u00b7 ${esc(o.customerName)}</div><div class="text-xs" style="color: var(--sub);">${esc(o.description || 'No description')} \u00b7 ${formatSARShort(o.totalValue)}</div></div></div>`;
    });
  }

  if (allItems.length === 0) {
    html = '<div class="px-5 py-8 text-center text-sm" style="color: var(--sub);">No results found for "' + esc(query) + '"</div>';
  }

  container.innerHTML = html;
  container._allItems = allItems;

  container.querySelectorAll('.cmd-result').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      const item = allItems[idx];
      if (item) { if (item.data.action) item.data.action(); else { closeCmdPalette(); openOrderDetail(item.data.orderId); } }
    });
    el.addEventListener('mouseenter', () => {
      container.querySelectorAll('.cmd-result').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
      state.cmdSelectedIndex = parseInt(el.dataset.idx);
    });
  });

  if (window.lucide) lucide.createIcons();
}

// ============================================================
// PDF EXPORT
// ============================================================
function exportPDF() {
  if (state.isExportingPdf) return;
  state.isExportingPdf = true;
  const btn = document.getElementById('pdf-btn');
  if (btn) btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4" style="animation: spin 1s linear infinite;"></i> Generating...';
  if (window.lucide) lucide.createIcons();

  try {
    const filtered = getFilteredOrders();
    if (filtered.length === 0) {
      toast('No orders to export', 'No orders match your current filters.', 'destructive');
      state.isExportingPdf = false;
      if (btn) btn.innerHTML = '<i data-lucide="file-text" class="w-4 h-4"></i> <span>Export PDF</span>';
      if (window.lucide) lucide.createIcons();
      return;
    }

    const groups = {};
    for (const o of filtered) {
      const k = o.productType || 'Uncategorized';
      if (!groups[k]) groups[k] = [];
      groups[k].push(o);
    }
    const groupArray = Object.entries(groups).map(([productType, orders]) => ({
      productType, orders,
      totalValue: orders.reduce((s, o) => s + (o.totalValue || 0), 0),
      orderCount: orders.length,
    })).sort((a, b) => b.totalValue - a.totalValue);

    const totalValue = filtered.reduce((s, o) => s + (o.totalValue || 0), 0);
    const totalCliche = filtered.reduce((s, o) => s + (o.clicheValue || 0), 0);

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 14;
    const contentWidth = pageWidth - margin * 2;

    const PRIMARY = [27, 42, 74];
    const PRIMARY_DARK = [13, 17, 23];
    const ACCENT = [201, 162, 39];
    const TEXT = [15, 23, 42];
    const MUTED = [71, 85, 105];
    const BORDER = [229, 231, 235];
    const LIGHT_BG = [243, 244, 246];
    const WHITE = [255, 255, 255];

    doc.setFillColor(...PRIMARY_DARK);
    doc.rect(0, 0, pageWidth, 24, 'F');
    doc.setFillColor(...PRIMARY);
    doc.roundedRect(margin, 4, 16, 16, 2, 2, 'F');
    doc.setTextColor(...WHITE);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(13);
    doc.text('CG', margin + 8, 14.5, { align: 'center' });
    doc.setFontSize(15);
    doc.text('Century Gate Company Ltd', margin + 20, 12);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.text('Order Tracker \u2014 Filtered Orders Export', margin + 20, 18);
    const now = new Date();
    const ts = now.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    doc.setFontSize(8);
    doc.text('Generated ' + ts, pageWidth - margin, 12, { align: 'right' });
    doc.text(filtered.length + ' orders \u00b7 ' + groupArray.length + ' categories', pageWidth - margin, 18, { align: 'right' });

    let cursorY = 30;

    const kpiWidth = (contentWidth - 6) / 4;
    const kpis = [
      { label: 'TOTAL ORDERS', value: String(filtered.length), accent: PRIMARY },
      { label: 'TOTAL VALUE', value: 'SAR ' + totalValue.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }), accent: ACCENT },
      { label: 'TOTAL CLICHE', value: 'SAR ' + totalCliche.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }), accent: PRIMARY },
      { label: 'CATEGORIES', value: String(groupArray.length), accent: ACCENT },
    ];
    kpis.forEach((kpi, i) => {
      const x = margin + i * (kpiWidth + 2);
      doc.setFillColor(...LIGHT_BG);
      doc.roundedRect(x, cursorY, kpiWidth, 16, 2, 2, 'F');
      doc.setTextColor(...MUTED);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(7);
      doc.text(kpi.label, x + 3, cursorY + 5);
      doc.setTextColor(...kpi.accent);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.text(kpi.value, x + 3, cursorY + 12);
    });
    cursorY += 22;

    const activeFilters = [];
    if (state.search) activeFilters.push('Search: ' + state.search);
    if (state.filterCustomer) activeFilters.push('Customer: ' + state.filterCustomer);
    if (state.filterProductType) activeFilters.push('Product Type: ' + state.filterProductType);
    if (state.filterOrderType) activeFilters.push('Order Type: ' + state.filterOrderType);
    if (state.filterProduction) activeFilters.push('Production: ' + state.filterProduction);
    if (state.filterInvoice) activeFilters.push('Invoice: ' + state.filterInvoice);
    if (state.filterDelivery) activeFilters.push('Delivery: ' + state.filterDelivery);

    if (activeFilters.length > 0) {
      doc.setTextColor(...MUTED);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(7);
      doc.text('ACTIVE FILTERS', margin, cursorY + 1);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor(...TEXT);
      const filterText = activeFilters.join('    \u00b7    ');
      const wrapped = doc.splitTextToSize(filterText, contentWidth);
      doc.text(wrapped, margin, cursorY + 5);
      cursorY += 5 + wrapped.length * 4 + 4;
    } else {
      doc.setTextColor(...MUTED);
      doc.setFont('helvetica', 'italic');
      doc.setFontSize(8);
      doc.text('No filters applied \u2014 showing all orders.', margin, cursorY + 4);
      cursorY += 12;
    }

    groupArray.forEach((group) => {
      if (cursorY + 30 > pageHeight - margin) { doc.addPage(); cursorY = margin; }

      doc.setFillColor(...PRIMARY);
      doc.rect(margin, cursorY, contentWidth, 12, 'F');
      doc.setTextColor(...WHITE);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      doc.text(group.productType, margin + 4, cursorY + 8);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.text(group.orderCount + ' orders   \u00b7   SAR ' + group.totalValue.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }), pageWidth - margin - 4, cursorY + 8, { align: 'right' });
      cursorY += 14;

      const rows = group.orders.map(o => [
        o.customerNumber || '\u2014', formatDate(o.orderDate), o.customerName || '\u2014', o.description || '\u2014',
        formatNumber(o.quantity) + (o.qtyUnit ? ' ' + o.qtyUnit : ''),
        o.unitPrice != null ? o.unitPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '\u2014',
        o.clicheValue != null ? o.clicheValue.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '\u2014',
        o.totalValue != null ? o.totalValue.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '\u2014',
        formatDate(o.deadline), o.productionStatus || '\u2014',
      ]);

      doc.autoTable({
        startY: cursorY,
        head: [['Cust No', 'Order Date', 'Customer', 'Description', 'Quantity', 'Unit Price', 'Cliche', 'Total Value', 'Deadline', 'Production']],
        body: rows,
        theme: 'striped',
        headStyles: { fillColor: PRIMARY_DARK, textColor: WHITE, fontSize: 9, fontStyle: 'bold', halign: 'left', cellPadding: 2 },
        bodyStyles: { fontSize: 9, textColor: TEXT, cellPadding: 2, lineColor: BORDER, lineWidth: 0.1 },
        alternateRowStyles: { fillColor: LIGHT_BG },
        columnStyles: {
          0: { fontStyle: 'bold', textColor: PRIMARY },
          5: { halign: 'right' },
          6: { halign: 'right' },
          7: { halign: 'right', fontStyle: 'bold' },
        },
        tableWidth: 'auto',
        margin: { left: margin, right: margin, bottom: 14 },
        didDrawPage: function() {
          const pageNum = doc.internal.getNumberOfPages();
          doc.setFontSize(7);
          doc.setTextColor(...MUTED);
          doc.setFont('helvetica', 'normal');
          doc.text('Page ' + pageNum + '   \u00b7   Century Gate Order Tracker   \u00b7   ' + ts, pageWidth / 2, pageHeight - 6, { align: 'center' });
        },
      });

      cursorY = doc.lastAutoTable.finalY + 10;
    });

    if (cursorY + 30 > pageHeight - margin) { doc.addPage(); cursorY = margin; } else { cursorY += 4; }
    doc.setFillColor(...LIGHT_BG);
    doc.roundedRect(margin, cursorY, contentWidth, 22, 2, 2, 'F');
    doc.setTextColor(...PRIMARY_DARK);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10);
    doc.text('Export Summary', margin + 4, cursorY + 6);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.setTextColor(...TEXT);
    const summaryLines = [
      'Total orders exported: ' + filtered.length,
      'Total value across all categories: SAR ' + totalValue.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
      'Total cliche value: SAR ' + totalCliche.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
      'Number of product categories: ' + groupArray.length,
    ];
    summaryLines.forEach((line, i) => { doc.text(line, margin + 4, cursorY + 11 + i * 3); });

    const filename = 'century-gate-orders-' + now.toISOString().slice(0, 10) + '.pdf';
    doc.save(filename);

    toast('PDF exported', filtered.length + ' orders across ' + groupArray.length + ' categor' + (groupArray.length === 1 ? 'y' : 'ies') + ' exported.');
  } catch (e) {
    toast('PDF export failed', e.message || 'An unexpected error occurred.', 'destructive');
  } finally {
    state.isExportingPdf = false;
    if (btn) btn.innerHTML = '<i data-lucide="file-text" class="w-4 h-4"></i> <span>Export PDF</span>';
    if (window.lucide) lucide.createIcons();
  }
}

// ============================================================
// EVENT LISTENERS
// ============================================================
function attachEventListeners() {
  const searchInput = document.getElementById('search-input');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      state.search = e.target.value;
      state.page = 1;
      clearTimeout(window._searchTimer);
      window._searchTimer = setTimeout(() => { render(); }, 300);
    }, { passive: true });
  }

  const customerSearchInput = document.getElementById('customer-search-input');
  if (customerSearchInput) {
    customerSearchInput.addEventListener('input', (e) => {
      state.customerSearch = e.target.value;
      clearTimeout(window._customerSearchTimer);
      window._customerSearchTimer = setTimeout(() => { render(); }, 300);
    }, { passive: true });
  }

  if (document.getElementById('order-form')) {
    recalcTotalValue();
  }
}

// ============================================================
// GLOBAL KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    const open = document.getElementById('cmd-backdrop').style.display === 'flex';
    open ? closeCmdPalette() : openCmdPalette();
  }
  if (e.key === 'Escape') {
    closeCmdPalette();
  }
  const cmdOpen = document.getElementById('cmd-backdrop').style.display === 'flex';
  if (cmdOpen) {
    const container = document.getElementById('cmd-results');
    const items = container._allItems || [];
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      state.cmdSelectedIndex = Math.min(state.cmdSelectedIndex + 1, items.length - 1);
      updateCmdSelection();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      state.cmdSelectedIndex = Math.max(state.cmdSelectedIndex - 1, 0);
      updateCmdSelection();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const item = items[state.cmdSelectedIndex];
      if (item) {
        if (item.data.action) item.data.action();
        else { closeCmdPalette(); openOrderDetail(item.data.orderId); }
      }
    }
  }
});

function updateCmdSelection() {
  const container = document.getElementById('cmd-results');
  container.querySelectorAll('.cmd-result').forEach((el, i) => {
    el.classList.toggle('selected', parseInt(el.dataset.idx) === state.cmdSelectedIndex);
  });
  const sel = container.querySelector('.cmd-result.selected');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}

document.addEventListener('DOMContentLoaded', () => {
  const cmdInput = document.getElementById('cmd-input');
  if (cmdInput) {
    cmdInput.addEventListener('input', (e) => {
      renderCmdResults(e.target.value);
    });
  }
});

// ============================================================
// INIT
// ============================================================
function init() {
  loadOrders();
  loadCustomerMasters();
  render();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

const styleEl = document.createElement('style');
styleEl.textContent = '@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }';
document.head.appendChild(styleEl);

</script>
</body>
