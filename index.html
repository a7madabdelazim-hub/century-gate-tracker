<style>
/* ============================================================
   DESIGN TOKENS — Century Gate "Liquid Glass" (light only)
   ============================================================ */
:root {
  /* surfaces */
  --bg: #F5F2EA;
  --card: rgba(255,255,255,0.74);
  --card-solid: #FFFFFF;
  --card-2: rgba(250,248,242,0.82);
  --stripe: rgba(27,42,74,0.022);
  --glass-blur: blur(22px) saturate(180%);

  /* lines */
  --border: rgba(27,42,74,0.10);
  --border-strong: rgba(27,42,74,0.18);
  --hover: rgba(27,42,74,0.045);

  /* brand */
  --primary: #1B2A4A;
  --primary-2: #2E4372;
  --accent: #C9A227;
  --accent-2: #E8C04A;
  --primary-grad: linear-gradient(135deg, #1B2A4A 0%, #2E4372 55%, #3B5590 100%);
  --accent-grad: linear-gradient(135deg, #C9A227 0%, #E8C04A 100%);
  --primary-glow: rgba(27,42,74,0.28);
  --primary-soft: rgba(27,42,74,0.08);
  --accent-soft: rgba(201,162,39,0.14);

  /* semantic */
  --success: #1F8A5B;
  --success-soft: rgba(31,138,91,0.12);
  --success-line: rgba(31,138,91,0.30);
  --warning: #C2740A;
  --warning-soft: rgba(194,116,10,0.13);
  --warning-line: rgba(194,116,10,0.30);
  --danger: #C33C30;
  --danger-soft: rgba(195,60,48,0.12);
  --danger-line: rgba(195,60,48,0.30);
  --info: #2563C9;
  --info-soft: rgba(37,99,201,0.12);
  --info-line: rgba(37,99,201,0.30);
  --violet: #7C4DBE;
  --violet-soft: rgba(124,77,190,0.12);
  --teal: #0E8C8C;
  --teal-soft: rgba(14,140,140,0.12);

  /* type */
  --text: #16233D;
  --sub: #55607A;
  --muted: #8E9AB2;

  --shadow-sm: 0 2px 10px rgba(27,42,74,0.06);
  --shadow-md: 0 10px 30px rgba(27,42,74,0.10);
  --shadow-lg: 0 24px 70px rgba(27,42,74,0.18);
  --radius: 20px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---- animated liquid mesh backdrop ---- */
.mesh { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.mesh span {
  position: absolute; border-radius: 50%;
  filter: blur(80px); opacity: 0.62;
  will-change: transform;
}
.mesh span:nth-child(1) { width: 46vmax; height: 46vmax; top: -14vmax; left: -10vmax; background: radial-gradient(circle, #7FA8FF 0%, rgba(127,168,255,0) 70%); animation: drift1 26s ease-in-out infinite; }
.mesh span:nth-child(2) { width: 40vmax; height: 40vmax; top: 24vmax; right: -14vmax; background: radial-gradient(circle, #F2CE63 0%, rgba(242,206,99,0) 70%); animation: drift2 32s ease-in-out infinite; }
.mesh span:nth-child(3) { width: 34vmax; height: 34vmax; bottom: -12vmax; left: 18vmax; background: radial-gradient(circle, #86E3C6 0%, rgba(134,227,198,0) 70%); animation: drift3 29s ease-in-out infinite; }
.mesh span:nth-child(4) { width: 30vmax; height: 30vmax; top: 40%; left: 42%; background: radial-gradient(circle, #D9A7F0 0%, rgba(217,167,240,0) 70%); animation: drift4 36s ease-in-out infinite; opacity: 0.30; }
@keyframes drift1 { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(9vmax,7vmax,0) scale(1.14); } }
@keyframes drift2 { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(-11vmax,5vmax,0) scale(0.88); } }
@keyframes drift3 { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(7vmax,-8vmax,0) scale(1.18); } }
@keyframes drift4 { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(-8vmax,-6vmax,0) scale(1.10); } }
@media (prefers-reduced-motion: reduce) {
  .mesh span { animation: none; }
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ---- glass surfaces ---- */
.card {
  background: var(--card);
  backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid rgba(255,255,255,0.55);
  box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.75);
  border-radius: var(--radius);
  position: relative;
  transition: transform 0.32s cubic-bezier(0.22,1.2,0.36,1), box-shadow 0.32s, border-color 0.32s;
}
.card-hover { cursor: pointer; overflow: hidden; }
.card-hover::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.55) 50%, transparent 65%);
  transform: translateX(-130%); transition: transform 0.75s cubic-bezier(0.22,1,0.36,1);
}
.card-hover:hover::after { transform: translateX(130%); }
.card-hover:hover {
  transform: translateY(-3px);
  border-color: rgba(201,162,39,0.55);
  box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255,255,255,0.9);
}
.card-hover:active { transform: translateY(-1px) scale(0.995); }

h1 { font-family: 'Cormorant Garamond', 'Inter', serif; font-weight: 700; }

/* ---- buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 18px; border-radius: 12px;
  font-size: 14px; font-weight: 600; font-family: inherit;
  cursor: pointer; border: none;
  transition: transform 0.2s cubic-bezier(0.22,1.2,0.36,1), box-shadow 0.2s, background 0.2s, border-color 0.2s, opacity 0.2s;
  position: relative; overflow: hidden; white-space: nowrap;
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary {
  background: var(--primary-grad); color: #F3E4B0;
  border: 1px solid rgba(201,162,39,0.65);
  box-shadow: 0 6px 18px rgba(27,42,74,0.28), inset 0 1px 0 rgba(255,255,255,0.18);
}
.btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(27,42,74,0.34); border-color: var(--accent-2); }
.btn-primary:active:not(:disabled) { transform: translateY(0) scale(0.98); }
.btn-accent {
  background: var(--accent-grad); color: #2B2205;
  border: 1px solid rgba(201,162,39,0.7);
  box-shadow: 0 6px 18px rgba(201,162,39,0.32);
}
.btn-accent:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(201,162,39,0.42); }
.btn-ghost {
  background: rgba(255,255,255,0.62);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border); color: var(--text);
}
.btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.9); border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.btn-ghost:active:not(:disabled) { transform: translateY(0) scale(0.98); }
.btn-danger { background: linear-gradient(135deg, #C33C30 0%, #DA5346 100%); color: #fff; box-shadow: 0 6px 18px rgba(195,60,48,0.30); }
.btn-danger:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(195,60,48,0.40); }
.btn-sm { padding: 6px 12px; font-size: 12.5px; border-radius: 10px; }

/* ---- KPI ---- */
.kpi-icon { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
.icon-primary { background: var(--primary-soft); color: var(--primary); }
.icon-accent  { background: var(--accent-soft);  color: #A8811A; }
.icon-success { background: var(--success-soft); color: var(--success); }
.icon-danger  { background: var(--danger-soft);  color: var(--danger); }
.icon-violet  { background: var(--violet-soft);  color: var(--violet); }
.kpi-value { font-size: 30px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.12; color: var(--text); }
@media (max-width: 640px) {
  .kpi-value { font-size: 21px; letter-spacing: -0.02em; }
  .kpi-tile { padding: 12px !important; }
}
.kpi-tile { position: relative; overflow: hidden; }
.kpi-tile::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 3px; }
.kpi-tile.t-primary::before { background: var(--primary-grad); }
.kpi-tile.t-accent::before  { background: var(--accent-grad); }
.kpi-tile.t-danger::before  { background: linear-gradient(90deg,#C33C30,#F08A7E); }
.kpi-tile.t-info::before    { background: linear-gradient(90deg,#2563C9,#7FA8FF); }
.kpi-tile.t-violet::before  { background: linear-gradient(90deg,#7C4DBE,#C39BF0); }

/* ---- table ---- */
.table { width: 100%; border-collapse: collapse; }
.table thead th {
  text-align: left; padding: 12px 14px;
  font-size: 11px; font-weight: 700; color: var(--sub);
  text-transform: uppercase; letter-spacing: 0.07em;
  background: rgba(250,248,242,0.94);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 5; white-space: nowrap;
}
.table tbody tr { transition: background 0.16s, box-shadow 0.16s; cursor: pointer; }
.table tbody tr:nth-child(even) { background: var(--stripe); }
.table tbody tr:hover { background: rgba(127,168,255,0.10); box-shadow: inset 3px 0 0 var(--accent); }
.table tbody td { padding: 13px 14px; font-size: 14px; border-bottom: 1px solid var(--border); }
.table tbody tr:last-child td { border-bottom: none; }

/* ---- chips ---- */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 11px; border-radius: 999px;
  font-size: 12px; font-weight: 600; border: 1px solid; white-space: nowrap;
}
.chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
.chip-plain::before { display: none; }
.chip-success { background: var(--success-soft); color: var(--success); border-color: var(--success-line); }
.chip-warning { background: var(--warning-soft); color: var(--warning); border-color: var(--warning-line); }
.chip-danger  { background: var(--danger-soft);  color: var(--danger);  border-color: var(--danger-line); }
.chip-info    { background: var(--info-soft);    color: var(--info);    border-color: var(--info-line); }
.chip-neutral { background: rgba(27,42,74,0.05); color: var(--sub); border-color: var(--border); }

/* ---- inputs ---- */
.input {
  width: 100%; padding: 10px 14px;
  background: rgba(255,255,255,0.80);
  border: 1px solid var(--border);
  border-radius: 12px; color: var(--text);
  font-size: 16px; font-family: inherit; outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}
.input::placeholder { color: var(--muted); }
.input:focus { background: #fff; border-color: var(--primary-2); box-shadow: 0 0 0 4px rgba(46,67,114,0.14); }
select.input {
  cursor: pointer; appearance: none; -webkit-appearance: none; -moz-appearance: none;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2355607A' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
  background-repeat: no-repeat; background-position: right 10px center; background-size: 14px;
  padding-right: 30px; width: 100%; min-width: 0;
}
select.input option { background: #fff; color: var(--text); padding: 10px 12px; }
@media (max-width: 768px) {
  select.input {
    appearance: auto; -webkit-appearance: auto; -moz-appearance: auto;
    background-image: none !important; padding: 14px 12px !important;
    line-height: 1.5 !important; min-height: 44px !important; height: auto !important; font-size: 16px !important;
  }
}
.checkbox {
  width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0;
  border: 2px solid var(--border-strong); background: #fff;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.18s, border-color 0.18s, transform 0.18s;
}
.checkbox.on { background: var(--primary-grad); border-color: var(--primary); transform: scale(1.06); }
.checkbox.on::after { content: ''; width: 6px; height: 10px; border: solid #F3E4B0; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px,-1px); }

/* ---- modals ---- */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(16,24,44,0.42);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  z-index: 100; display: flex; align-items: center; justify-content: center;
  padding: 16px; animation: fadeIn 0.18s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-content {
  background: rgba(255,255,255,0.90);
  backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.7);
  border-radius: 26px; box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.9);
  width: 100%; overflow: hidden;
  animation: modalIn 0.34s cubic-bezier(0.22,1.2,0.36,1);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.94) translateY(-14px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-head { background: var(--primary-grad); color: #fff; position: relative; overflow: hidden; }
.modal-head::after {
  content: ''; position: absolute; width: 220px; height: 220px; border-radius: 50%;
  background: radial-gradient(circle, rgba(232,192,74,0.34) 0%, rgba(232,192,74,0) 70%);
  top: -110px; right: -60px;
}
.modal-head h2, .modal-head .mh-title { color: #fff; }
.modal-head p, .modal-head .mh-sub { color: rgba(255,255,255,0.74); }

/* ---- command palette ---- */
.cmd-backdrop {
  position: fixed; inset: 0;
  background: rgba(16,24,44,0.42); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  z-index: 100; display: flex; align-items: flex-start; justify-content: center;
  padding-top: 12vh; animation: fadeIn 0.18s ease-out;
}
.cmd-modal {
  width: 100%; max-width: 580px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.7);
  border-radius: 20px; box-shadow: var(--shadow-lg);
  overflow: hidden; animation: modalIn 0.34s cubic-bezier(0.22,1.2,0.36,1);
}
.cmd-result { display: flex; align-items: center; gap: 12px; padding: 11px 20px; cursor: pointer; transition: background 0.15s; }
.cmd-result:hover, .cmd-result.selected { background: rgba(127,168,255,0.14); }

/* ---- motion ---- */
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.fade-up { animation: fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) both; }
.d1 { animation-delay: 0.05s; } .d2 { animation-delay: 0.10s; } .d3 { animation-delay: 0.15s; } .d4 { animation-delay: 0.20s; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.spin { animation: spin 1s linear infinite; }

/* ---- FAB ---- */
.fab {
  position: fixed; bottom: calc(92px + env(safe-area-inset-bottom)); right: 20px;
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--primary-grad); color: #F3E4B0; border: 1px solid rgba(201,162,39,0.6); cursor: pointer;
  box-shadow: 0 14px 34px var(--primary-glow), inset 0 1px 0 rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  z-index: 45; transition: transform 0.3s cubic-bezier(0.22,1.2,0.36,1), box-shadow 0.3s;
}
.fab:hover { transform: scale(1.10) rotate(90deg); box-shadow: 0 18px 44px var(--primary-glow); }
.fab:active { transform: scale(0.94); }

/* ---- bottom nav ---- */
.bottom-nav {
  position: fixed; left: 14px; right: 14px; z-index: 40;
  bottom: max(14px, env(safe-area-inset-bottom));
  background: rgba(255,255,255,0.68);
  border: 1px solid rgba(255,255,255,0.6);
  backdrop-filter: blur(26px) saturate(190%); -webkit-backdrop-filter: blur(26px) saturate(190%);
  border-radius: 26px; padding: 7px;
  box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255,255,255,0.85);
  display: flex; gap: 6px; justify-content: center;
}
.nav-btn {
  flex: 1; max-width: 200px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 12px; border-radius: 20px;
  font-size: 14.5px; font-weight: 700; cursor: pointer;
  border: none; transition: all 0.32s cubic-bezier(0.22,1.2,0.36,1);
  color: var(--sub); background: transparent;
  font-family: inherit; position: relative; overflow: hidden;
}
.nav-btn:hover { color: var(--text); background: rgba(27,42,74,0.05); }
.nav-btn.active {
  background: var(--primary-grad); color: #F3E4B0;
  box-shadow: 0 6px 18px rgba(27,42,74,0.30);
  transform: translateY(-2px);
}
@media (max-width: 420px) { .nav-btn span { font-size: 12.5px; } .nav-btn { padding: 11px 6px; gap: 6px; } }

/* ---- misc ---- */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(27,42,74,0.20); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--sub); }
.scroll-thin::-webkit-scrollbar { width: 6px; }
.tabular-nums { font-variant-numeric: tabular-nums; }
button, nav, aside { -webkit-user-select: none; user-select: none; }
.avatar {
  border-radius: 16px; display: flex; align-items: center; justify-content: center;
  font-weight: 800; color: #F3E4B0; background: var(--primary-grad);
  box-shadow: 0 4px 14px rgba(27,42,74,0.26), inset 0 1px 0 rgba(255,255,255,0.22);
  flex-shrink: 0;
}
.trend-up   { color: var(--danger); }
.trend-down { color: var(--success); }
.trend-flat { color: var(--muted); }
.divider { border: none; border-top: 1px solid var(--border); margin: 0; }
.sortbtn { display: flex; align-items: center; gap: 4px; font-weight: 700; }
.table-wrap { border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.table-wrap > div { overflow-x: auto; overflow-y: auto; }
.table-embed { min-width: 560px; font-size: 13px; }
.table-embed thead th { padding: 9px 12px; }
.table-embed tbody td { padding: 10px 12px; }
.banner {
  border-radius: 16px; padding: 14px 16px;
  background: linear-gradient(120deg, rgba(232,192,74,0.20) 0%, rgba(127,168,255,0.16) 100%);
  border: 1px solid rgba(201,162,39,0.34);
}
.alias-tag {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 8px; border-radius: 8px; font-size: 10.5px; font-weight: 700;
  background: rgba(124,77,190,0.12); color: var(--violet); border: 1px solid rgba(124,77,190,0.26);
}
</style>

// ============================================================
// ESCAPING HELPERS
// esc()  -> safe for HTML text nodes
// attr() -> safe for double-quoted HTML attribute values
// Inline onclick handlers with interpolated data are NEVER used;
// everything goes through data-* attributes + event delegation.
// ============================================================
function esc(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
function attr(str) {
  if (str == null) return '';
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}
const DASH = '—';
function dash(html) {
  if (html == null) return '<span style="color:var(--muted);">' + DASH + '</span>';
  const s = String(html).trim();
  if (s === '' || s === DASH) return '<span style="color:var(--muted);">' + DASH + '</span>';
  return s;
}

const STORAGE_KEY = 'century-gate-orders';
const CUSTOMERS_STORAGE_KEY = 'century-gate-customers';

function safeSet(key, value) {
  try {
    localStorage.setItem(key, value);
    return true;
  } catch (e) {
    console.error('Storage write failed for ' + key, e);
    toast('Could not save', 'Browser storage is full or blocked. Your latest change may be lost on reload.', 'destructive');
    return false;
  }
}
function safeGet(key) {
  try { return localStorage.getItem(key); }
  catch (e) { console.error('Storage read failed for ' + key, e); return null; }
}

function loadOrders() {
  const stored = safeGet(STORAGE_KEY);
  if (stored) {
    try {
      const parsed = JSON.parse(stored);
      if (Array.isArray(parsed)) { state.orders = parsed; return; }
    } catch (e) { console.warn('Failed to parse stored orders, re-seeding', e); }
  }
  state.orders = SEED_ORDERS.map(o => ({ ...o }));
  saveOrders();
}
function saveOrders() { safeSet(STORAGE_KEY, JSON.stringify(state.orders)); }

function loadCustomerMasters() {
  const stored = safeGet(CUSTOMERS_STORAGE_KEY);
  if (stored) {
    try {
      const parsed = JSON.parse(stored);
      if (Array.isArray(parsed)) { state.customers = parsed; return; }
    } catch (e) { console.warn('Failed to parse stored customers, resetting', e); }
  }
  state.customers = [];
}
function saveCustomerMasters() { safeSet(CUSTOMERS_STORAGE_KEY, JSON.stringify(state.customers)); }

function loadCustomerGroups() {
  const stored = safeGet(GROUPS_STORAGE_KEY);
  if (stored) {
    try {
      const parsed = JSON.parse(stored);
      if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) { state.customerGroups = parsed; return; }
    } catch (e) { console.warn('Failed to parse customer groups, resetting', e); }
  }
  state.customerGroups = {};
}
function saveCustomerGroups() { safeSet(GROUPS_STORAGE_KEY, JSON.stringify(state.customerGroups)); }

function getCustomerMaster(name) {
  return state.customers.find(c => c.customerName === name) || null;
}
function upsertCustomerMaster(data) {
  const idx = state.customers.findIndex(c => c.customerName === data.customerName);
  if (idx === -1) state.customers.push(data);
  else state.customers[idx] = { ...state.customers[idx], ...data };
  saveCustomerMasters();
}

// ============================================================
// CUSTOMER ALIAS / MERGE LAYER
// ------------------------------------------------------------
// Orders always keep the customer name exactly as it was typed.
// state.customerGroups maps a typed name -> the master (group)
// name it should be displayed under on the Customers tab. The
// mapping is permanent, so any future order typed with an alias
// automatically rolls up under its master.
// ============================================================
function normName(name) {
  return String(name == null ? '' : name).trim().toUpperCase();
}

// Resolve a typed order name to its display/group name.
// Follows alias chains defensively (max 10 hops) so a merge of a
// merge can never produce an infinite loop.
function resolveCustomerName(rawName) {
  let current = String(rawName == null ? '' : rawName).trim();
  if (!current) return 'UNKNOWN';
  const seen = new Set();
  for (let i = 0; i < 10; i++) {
    const key = normName(current);
    if (seen.has(key)) break;
    seen.add(key);
    const next = state.customerGroups[key];
    if (!next || normName(next) === key) break;
    current = next;
  }
  return current;
}

// Fold every selected group into targetName (typed freely by the user).
function mergeCustomers(sourceNames, targetName) {
  const target = String(targetName || '').trim();
  if (!target) return { merged: 0, orders: 0 };
  const targetKey = normName(target);
  const sourceKeys = new Set(sourceNames.map(normName).filter(k => k && k !== targetKey));
  if (sourceKeys.size === 0) return { merged: 0, orders: 0 };

  const groups = { ...state.customerGroups };
  let ordersMoved = 0;

  // 1. Every typed order name that currently resolves into a source.
  for (const o of state.orders) {
    const raw = (o.customerName || '').trim();
    if (!raw) continue;
    if (sourceKeys.has(normName(resolveCustomerName(raw)))) {
      groups[normName(raw)] = target;
      ordersMoved++;
    }
  }
  // 2. Existing aliases whose master is a source get repointed.
  for (const [alias, master] of Object.entries(groups)) {
    if (sourceKeys.has(normName(master))) groups[alias] = target;
  }
  // 3. The source names themselves.
  for (const key of sourceKeys) groups[key] = target;
  // 4. Drop identity mappings (a name pointing at itself).
  for (const key of Object.keys(groups)) {
    if (normName(groups[key]) === key) delete groups[key];
  }

  state.customerGroups = groups;
  saveCustomerGroups();

  // Fold master contact records into the target, keeping the first non-empty value.
  const FIELDS = ['phone', 'email', 'address', 'category', 'salesperson', 'notes'];
  const targetRecord = { ...(getCustomerMaster(target) || {}), customerName: target };
  let touched = false;
  for (const rec of state.customers.slice()) {
    if (!sourceKeys.has(normName(rec.customerName))) continue;
    touched = true;
    for (const f of FIELDS) {
      if (!targetRecord[f] && rec[f]) targetRecord[f] = rec[f];
    }
  }
  state.customers = state.customers.filter(r => !sourceKeys.has(normName(r.customerName)));
  if (touched || getCustomerMaster(target)) {
    const idx = state.customers.findIndex(c => normName(c.customerName) === targetKey);
    if (idx === -1) state.customers.push(targetRecord);
    else state.customers[idx] = targetRecord;
    saveCustomerMasters();
  }

  return { merged: sourceKeys.size, orders: ordersMoved };
}

// Pull a single typed name back out of its group.
function unmergeAlias(aliasName) {
  const key = normName(aliasName);
  if (!state.customerGroups[key]) return false;
  delete state.customerGroups[key];
  saveCustomerGroups();
  return true;
}

// A "signature" used to spot names that are probably the same customer:
// uppercase, letters+digits only, with a leading AL/EL article removed.
function nameSignature(name) {
  let s = normName(name).replace(/[^A-Z0-9]/g, '');
  s = s.replace(/^(AL|EL)/, '');
  return s;
}

// Clusters of distinct customers that look like duplicates:
// same customer number, or the same name signature.
function findDuplicateSuggestions() {
  const list = getCustomerList({ skipSearch: true });
  const byNumber = {};
  const bySignature = {};
  for (const c of list) {
    for (const num of c.numbers) {
      if (!num) continue;
      (byNumber[num] = byNumber[num] || []).push(c.customerName);
    }
    const sig = nameSignature(c.customerName);
    if (sig.length >= 3) (bySignature[sig] = bySignature[sig] || []).push(c.customerName);
  }
  const clusters = [];
  const seen = new Set();
  function push(names, reason, detail) {
    const uniq = Array.from(new Set(names));
    if (uniq.length < 2) return;
    const key = uniq.slice().sort().join('|');
    if (seen.has(key)) return;
    seen.add(key);
    clusters.push({ names: uniq, reason, detail });
  }
  for (const [num, names] of Object.entries(byNumber)) push(names, 'number', 'Customer #' + num);
  for (const names of Object.values(bySignature)) push(names, 'name', 'Nearly identical names');
  clusters.sort((a, b) => (a.reason === b.reason ? b.names.length - a.names.length : (a.reason === 'number' ? -1 : 1)));
  return clusters;
}

// ============================================================
// CUSTOMER LIST (grouped by resolved name)
// ============================================================
function getCustomerList(opts) {
  const options = opts || {};
  const map = {};
  for (const o of state.orders) {
    const raw = (o.customerName || '').trim() || 'UNKNOWN';
    const name = resolveCustomerName(raw);
    const key = normName(name);
    if (!map[key]) {
      map[key] = {
        customerName: name, customerNumber: '',
        orders: 0, totalValue: 0, lastOrderDate: null, overdueCount: 0,
        aliasSet: new Set(), brandSet: new Set(), numberSet: new Set(), openValue: 0,
      };
    }
    const entry = map[key];
    entry.orders++;
    entry.totalValue += o.totalValue || 0;
    if (o.deliveryStatus !== 'Fully Delivered') entry.openValue += o.totalValue || 0;
    if (o.customerNumber) {
      entry.numberSet.add(String(o.customerNumber));
      if (!entry.customerNumber) entry.customerNumber = String(o.customerNumber);
    }
    if (!entry.lastOrderDate || new Date(o.orderDate) > new Date(entry.lastOrderDate)) entry.lastOrderDate = o.orderDate;
    if (isOverdue(o.deadline, o.deliveryStatus)) entry.overdueCount++;
    entry.brandSet.add(raw);
    if (normName(raw) !== key) entry.aliasSet.add(raw);
  }

  let list = Object.values(map).map(c => {
    const master = getCustomerMaster(c.customerName) || {};
    return {
      customerName: c.customerName,
      customerNumber: c.customerNumber,
      orders: c.orders,
      totalValue: c.totalValue,
      openValue: c.openValue,
      lastOrderDate: c.lastOrderDate,
      overdueCount: c.overdueCount,
      avgOrder: c.orders > 0 ? c.totalValue / c.orders : 0,
      aliases: Array.from(c.aliasSet).sort(),
      brands: Array.from(c.brandSet).sort(),
      numbers: Array.from(c.numberSet).sort(),
      phone: master.phone || '', email: master.email || '', address: master.address || '',
      category: master.category || '', salesperson: master.salesperson || '', notes: master.notes || '',
    };
  });

  if (!options.skipSearch && state.customerSearch) {
    const q = state.customerSearch.toLowerCase();
    list = list.filter(c =>
      c.customerName.toLowerCase().includes(q) ||
      c.numbers.some(n => n.toLowerCase().includes(q)) ||
      (c.phone || '').toLowerCase().includes(q) ||
      c.aliases.some(a => a.toLowerCase().includes(q))
    );
  }
  list.sort((a, b) => b.totalValue - a.totalValue);
  return list;
}

// ============================================================
// ITEM / PRICE INDEX
// One entry per (grouped customer + item description): last price,
// last date, order count and the full price history.
// ============================================================
const ITEM_SEP = '\u0001';
function itemKey(customerName, description) {
  return normName(customerName) + ITEM_SEP + normName(description);
}

function buildItemIndex() {
  const map = {};
  for (const o of state.orders) {
    const raw = (o.customerName || '').trim() || 'UNKNOWN';
    const customer = resolveCustomerName(raw);
    const description = (o.description || '').trim() || 'UNSPECIFIED ITEM';
    const key = itemKey(customer, description);
    if (!map[key]) {
      map[key] = {
        key, customer, description,
        productType: o.productType || '',
        qtyUnit: o.qtyUnit || '',
        history: [],
      };
    }
    map[key].history.push({
      orderId: o.orderId, orderDate: o.orderDate, typedName: raw,
      quantity: o.quantity, qtyUnit: o.qtyUnit, unitPrice: o.unitPrice,
      clicheValue: o.clicheValue, totalValue: o.totalValue,
      productionStatus: o.productionStatus, deliveryStatus: o.deliveryStatus,
      productType: o.productType, deadline: o.deadline,
    });
  }
  return Object.values(map).map(entry => {
    entry.history.sort((a, b) => new Date(b.orderDate || 0) - new Date(a.orderDate || 0));
    const priced = entry.history.filter(h => h.unitPrice != null && !isNaN(h.unitPrice));
    const latest = priced[0] || entry.history[0] || {};
    const previous = priced[1] || null;
    const prices = priced.map(h => Number(h.unitPrice));
    entry.times = entry.history.length;
    entry.lastPrice = latest.unitPrice != null ? Number(latest.unitPrice) : null;
    entry.lastDate = latest.orderDate || null;
    entry.lastQty = latest.quantity != null ? Number(latest.quantity) : null;
    entry.qtyUnit = latest.qtyUnit || entry.qtyUnit;
    entry.productType = latest.productType || entry.productType;
    entry.prevPrice = previous && previous.unitPrice != null ? Number(previous.unitPrice) : null;
    entry.priceDelta = (entry.lastPrice != null && entry.prevPrice != null) ? entry.lastPrice - entry.prevPrice : null;
    entry.minPrice = prices.length ? Math.min(...prices) : null;
    entry.maxPrice = prices.length ? Math.max(...prices) : null;
    entry.totalValue = entry.history.reduce((s, h) => s + (h.totalValue || 0), 0);
    entry.totalQty = entry.history.reduce((s, h) => s + (h.quantity || 0), 0);
    return entry;
  });
}

function getFilteredItems() {
  let items = buildItemIndex();
  if (state.itemSearch) {
    const q = state.itemSearch.toLowerCase();
    items = items.filter(i =>
      i.description.toLowerCase().includes(q) ||
      i.customer.toLowerCase().includes(q) ||
      (i.productType || '').toLowerCase().includes(q)
    );
  }
  if (state.itemFilterProduct) items = items.filter(i => i.productType === state.itemFilterProduct);
  if (state.itemFilterCustomer) items = items.filter(i => normName(i.customer) === normName(state.itemFilterCustomer));

  const dir = state.itemSortDir === 'asc' ? 1 : -1;
  const field = state.itemSort;
  items.sort((a, b) => {
    if (field === 'lastPrice' || field === 'times' || field === 'totalValue' || field === 'totalQty') {
      const av = a[field] == null ? -Infinity : a[field];
      const bv = b[field] == null ? -Infinity : b[field];
      return (av - bv) * dir;
    }
    if (field === 'lastDate') {
      return (new Date(a.lastDate || 0) - new Date(b.lastDate || 0)) * dir;
    }
    return String(a[field] || '').localeCompare(String(b[field] || '')) * dir;
  });
  return items;
}

// Items for one grouped customer, newest first.
function getCustomerItems(customerName) {
  const key = normName(customerName);
  return buildItemIndex()
    .filter(i => normName(i.customer) === key)
    .sort((a, b) => new Date(b.lastDate || 0) - new Date(a.lastDate || 0));
}

// Same item description sold to other customers — for price comparison.
function getItemAcrossCustomers(description) {
  const key = normName(description);
  return buildItemIndex()
    .filter(i => normName(i.description) === key)
    .sort((a, b) => (b.lastPrice || 0) - (a.lastPrice || 0));
}

// Most recent priced order for a customer + item, used by the order form hint.
function findLastPrice(customerName, description) {
  const cKey = normName(resolveCustomerName(customerName));
  const dKey = normName(description);
  if (!cKey || !dKey) return null;
  let exact = null, partial = null;
  for (const o of state.orders) {
    if (o.unitPrice == null || isNaN(o.unitPrice)) continue;
    if (normName(resolveCustomerName(o.customerName)) !== cKey) continue;
    const od = normName(o.description);
    if (!od) continue;
    if (od === dKey) {
      if (!exact || new Date(o.orderDate || 0) > new Date(exact.orderDate || 0)) exact = o;
    } else if (dKey.length >= 3 && (od.includes(dKey) || dKey.includes(od))) {
      if (!partial || new Date(o.orderDate || 0) > new Date(partial.orderDate || 0)) partial = o;
    }
  }
  if (exact) return { order: exact, match: 'exact' };
  if (partial) return { order: partial, match: 'similar' };
  return null;
}

// ORDER FILTERING
// ============================================================
function getFilteredOrders() {
  let filtered = state.orders.slice();
  if (state.search) {
    const q = state.search.toLowerCase();
    filtered = filtered.filter(o =>
      (o.orderId || '').toLowerCase().includes(q) ||
      (o.customerName || '').toLowerCase().includes(q) ||
      (o.customerNumber || '').toLowerCase().includes(q) ||
      (o.description || '').toLowerCase().includes(q) ||
      (o.productType || '').toLowerCase().includes(q)
    );
  }
  if (state.filterCustomer) filtered = filtered.filter(o => (o.customerName || '').trim() === state.filterCustomer);
  if (state.filterCustomerGroup) filtered = filtered.filter(o => normName(resolveCustomerName(o.customerName)) === normName(state.filterCustomerGroup));
  if (state.filterProductType) filtered = filtered.filter(o => o.productType === state.filterProductType);
  if (state.filterOrderType) filtered = filtered.filter(o => (o.orderType || '').trim() === state.filterOrderType);
  if (state.filterProduction) filtered = filtered.filter(o => o.productionStatus === state.filterProduction);
  if (state.filterInvoice) filtered = filtered.filter(o => o.invoiceStatus === state.filterInvoice);
  if (state.filterDelivery) filtered = filtered.filter(o => o.deliveryStatus === state.filterDelivery);

  const sortMap = {
    orderId: 'orderId', orderDate: 'orderDate', customer: 'customerName',
    productType: 'productType', quantity: 'quantity',
    unitPrice: 'unitPrice', totalValue: 'totalValue', deadline: 'deadline',
  };
  const field = sortMap[state.sortBy] || 'orderDate';
  const dir = state.sortDir === 'asc' ? 1 : -1;
  filtered.sort((a, b) => {
    let av = a[field], bv = b[field];
    if (av == null) av = (typeof bv === 'number' ? -Infinity : '');
    if (bv == null) bv = (typeof av === 'number' ? -Infinity : '');
    if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * dir;
    return String(av).localeCompare(String(bv)) * dir;
  });
  return filtered;
}

function getNextOrderId() {
  let maxN = 0;
  for (const o of state.orders) {
    const m = /^ORD-(\d+)$/i.exec(o.orderId || '');
    if (m) { const n = parseInt(m[1], 10); if (n > maxN) maxN = n; }
  }
  return 'ORD-' + String(maxN + 1).padStart(3, '0');
}
function createOrder(data) {
  const newOrder = { ...data };
  state.orders.unshift(newOrder);
  saveOrders();
  return newOrder;
}
function updateOrder(orderId, data) {
  const idx = state.orders.findIndex(o => o.orderId === orderId);
  if (idx === -1) return null;
  state.orders[idx] = { ...state.orders[idx], ...data };
  saveOrders();
  return state.orders[idx];
}
function deleteOrder(orderId) {
  state.orders = state.orders.filter(o => o.orderId !== orderId);
  saveOrders();
}

// ============================================================
// FORMATTERS
// ============================================================
function formatSAR(value, decimals = 2) {
  if (value == null || isNaN(value)) return DASH;
  return 'SAR ' + Number(value).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function formatSARShort(value) {
  if (value == null || isNaN(value)) return DASH;
  const v = Number(value);
  if (Math.abs(v) >= 1e6) return 'SAR ' + (v / 1e6).toFixed(2) + 'M';
  if (Math.abs(v) >= 1e3) return 'SAR ' + (v / 1e3).toFixed(1) + 'K';
  return 'SAR ' + v.toFixed(0);
}
function formatNumber(value, decimals = 0) {
  if (value == null || isNaN(value)) return DASH;
  return Number(value).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function formatDate(iso) {
  if (!iso) return DASH;
  const d = new Date(iso);
  if (isNaN(d.getTime())) return DASH;
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}
function isOverdue(deadline, deliveryStatus) {
  if (!deadline) return false;
  if (deliveryStatus === 'Fully Delivered') return false;
  const d = new Date(deadline);
  if (isNaN(d.getTime())) return false;
  return d.getTime() < Date.now();
}

// ============================================================
// CHIPS
// ============================================================
const GOOD_STATUSES = ['Completed', 'Fully Delivered', 'Invoiced', 'Fully Paid'];
const WARN_STATUSES = ['In Progress', 'Partially Delivered', '50% Advance Paid'];
const BAD_STATUSES  = ['Not Shipped', 'No Payment'];
const NEUTRAL_STATUSES = ['Pending', 'Not Invoiced', 'Reorder'];

function statusChipClass(value) {
  if (!value) return 'chip chip-neutral';
  const v = String(value).trim();
  if (GOOD_STATUSES.includes(v)) return 'chip chip-success';
  if (WARN_STATUSES.includes(v)) return 'chip chip-warning';
  if (BAD_STATUSES.includes(v)) return 'chip chip-danger';
  if (NEUTRAL_STATUSES.includes(v)) return 'chip chip-neutral';
  if (v === 'New Order') return 'chip chip-info';
  return 'chip chip-neutral';
}
function statusChip(value) {
  if (!value) return '<span style="color:var(--muted)">' + DASH + '</span>';
  return '<span class="' + statusChipClass(value) + '">' + esc(value) + '</span>';
}
function productChip(value) {
  if (!value) return '<span style="color:var(--muted)">' + DASH + '</span>';
  const meta = productMeta(value);
  return '<span class="chip chip-plain" style="background:' + meta.bg + ';color:' + meta.fg + ';border-color:' + meta.bd + '"><i data-lucide="' + meta.icon + '" class="w-3 h-3"></i>' + esc(value) + '</span>';
}

// Vivid, distinct colour per product type.
function productMeta(productType) {
  const v = String(productType || '').trim();
  const map = {
    'Printed Paper Bags': { icon: 'shopping-bag', color: '#2563C9' },
    'Printed Boxes':      { icon: 'package',      color: '#C2740A' },
    'Printed Cups':       { icon: 'coffee',       color: '#0E8C8C' },
    'Printed Napkins':    { icon: 'sticky-note',  color: '#C33C30' },
    'Printed Sheet':      { icon: 'file-text',    color: '#7C4DBE' },
    'Plain Items':        { icon: 'circle-dot',   color: '#1F8A5B' },
  };
  const m = map[v] || { icon: 'tag', color: '#55607A' };
  const hex = m.color.replace('#', '');
  const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
  return {
    icon: m.icon, color: m.color, fg: m.color,
    bg: 'rgba(' + r + ',' + g + ',' + b + ',0.13)',
    bd: 'rgba(' + r + ',' + g + ',' + b + ',0.32)',
  };
}

function trendBadge(delta, prevPrice) {
  if (delta == null || prevPrice == null || delta === 0) {
    return '<span class="trend-flat text-[11px] font-semibold">no change</span>';
  }
  const up = delta > 0;
  const pct = prevPrice !== 0 ? Math.abs(delta / prevPrice) * 100 : 0;
  return '<span class="' + (up ? 'trend-up' : 'trend-down') + ' text-[11px] font-bold inline-flex items-center gap-1">' +
    '<i data-lucide="' + (up ? 'trending-up' : 'trending-down') + '" class="w-3 h-3"></i>' +
    (up ? '+' : '−') + formatNumber(Math.abs(delta), 2) + ' (' + pct.toFixed(1) + '%)</span>';
}

// ============================================================
// TOAST
// ============================================================
function toast(title, description, variant) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const el = document.createElement('div');
  const isErr = variant === 'destructive';
  el.style.cssText = 'background: rgba(255,255,255,0.94); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid ' +
    (isErr ? 'var(--danger-line)' : 'rgba(255,255,255,0.7)') +
    '; border-radius: 16px; padding: 12px 18px; color: var(--text); font-size: 14px; box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 10px; pointer-events: auto; min-width: 280px; max-width: 92vw; opacity: 0; transform: translateY(20px) scale(0.96); transition: all 0.34s cubic-bezier(0.22,1.2,0.36,1);';
  el.innerHTML = '<div class="kpi-icon ' + (isErr ? 'icon-danger' : 'icon-success') + '" style="width:30px;height:30px;border-radius:10px;flex-shrink:0;"><i data-lucide="' + (isErr ? 'alert-circle' : 'check-circle') + '" class="w-4 h-4"></i></div>' +
    '<div><div style="font-weight:700;font-size:14px;">' + esc(title) + '</div>' +
    (description ? '<div style="font-size:12px;color:var(--sub);margin-top:2px;">' + esc(description) + '</div>' : '') + '</div>';
  container.appendChild(el);
  if (window.lucide) lucide.createIcons();
  requestAnimationFrame(() => { el.style.opacity = '1'; el.style.transform = 'translateY(0) scale(1)'; });
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(20px) scale(0.96)';
    setTimeout(() => el.remove(), 340);
  }, 3600);
}


// ============================================================
// RENDER — main entry point
// ============================================================
let _renderQueued = false;

function render() {
  const activeEl = document.activeElement;
  const focusId = activeEl && activeEl.id ? activeEl.id : null;
  const focusName = activeEl && activeEl.name ? activeEl.name : null;
  const selectionStart = activeEl && activeEl.selectionStart != null ? activeEl.selectionStart : null;
  const selectionEnd = activeEl && activeEl.selectionEnd != null ? activeEl.selectionEnd : null;
  const scrollEl = document.getElementById('scroll-main');
  const scrollY = scrollEl ? scrollEl.scrollTop : 0;

  if (_renderQueued) return;
  _renderQueued = true;

  requestAnimationFrame(() => {
    _renderQueued = false;
    const app = document.getElementById('app');
    if (!app) return;
    const viewChanged = (app.dataset.view || '') !== state.view;
    const shellExists = document.getElementById('main-content') !== null;

    if (viewChanged || !shellExists) {
      app.innerHTML = renderShell();
      app.dataset.view = state.view;
    }
    renderMainContent();
    renderModals();
    if (window.lucide) lucide.createIcons();

    attachEventListeners();

    let restored = null;
    if (focusId) restored = document.getElementById(focusId);
    else if (focusName) restored = document.querySelector('[name="' + focusName + '"]');
    if (restored && typeof restored.focus === 'function') {
      restored.focus();
      if (selectionStart != null && selectionEnd != null) {
        try { restored.setSelectionRange(selectionStart, selectionEnd); } catch (e) { /* not a text field */ }
      }
    }
    const newScrollEl = document.getElementById('scroll-main');
    if (newScrollEl) newScrollEl.scrollTop = scrollY;
  });
}

function renderShell() {
  return `
    <main id="scroll-main" class="flex-1 overflow-y-auto p-4 md:p-6" style="padding-top: max(1rem, env(safe-area-inset-top)); padding-bottom: calc(120px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch;">
      <div id="main-content" class="max-w-[1600px] mx-auto space-y-4"></div>

    <div id="modal-container"></div>

}

function renderBottomNav() {

    { key: 'orders',    icon: 'clipboard-list', label: 'Orders' },
    { key: 'items',     icon: 'tags',           label: 'Items' },
    { key: 'customers', icon: 'users',          label: 'Customers' },

                return `

                    <td class="font-mono text-xs font-bold whitespace-nowrap" style="color: var(--primary);">${esc(o.orderId)}</td>
                    <td class="text-xs whitespace-nowrap" style="color: var(--sub);">${formatDate(o.orderDate)}</td>
                    <td class="font-semibold text-sm whitespace-nowrap" style="color: var(--text);">
                      ${dash(esc(o.customerName))}
                      ${isGrouped ? '<span class="alias-tag" style="margin-left:6px;" title="Grouped under ' + attr(grouped) + ' on the Customers tab"><i data-lucide="link" class="w-2.5 h-2.5"></i>' + esc(grouped) + '</span>' : ''}
                    </td>
                    <td class="whitespace-nowrap">${productChip(o.productType)}</td>
                    <td class="text-xs max-w-[220px] truncate" style="color: var(--sub);">${dash(esc(o.description))}</td>
                    <td class="text-right text-xs tabular-nums whitespace-nowrap" style="color: var(--text);">${formatNumber(o.quantity)} <span style="color: var(--muted);">${esc(o.qtyUnit)}</span></td>
                    <td class="text-right text-xs tabular-nums whitespace-nowrap font-semibold" style="color: var(--text);">${o.unitPrice != null ? formatSAR(o.unitPrice) : DASH}</td>
                    <td class="text-right font-bold tabular-nums text-sm whitespace-nowrap" style="color: var(--primary);">${formatSARShort(o.totalValue)}</td>
                    <td class="text-xs whitespace-nowrap">
                      <div class="flex items-center gap-1">
                        ${overdue ? '<i data-lucide="alert-triangle" class="w-3 h-3 shrink-0" style="color: var(--danger);"></i>' : ''}
                        <span style="color: ${overdue ? 'var(--danger)' : 'var(--sub)'}; ${overdue ? 'font-weight:700;' : ''}">${formatDate(o.deadline)}</span>
                      </div>
                    </td>
                    <td class="whitespace-nowrap">${statusChip(o.productionStatus)}</td>
                    <td class="whitespace-nowrap">${statusChip(o.invoiceStatus)}</td>
                  </tr>
                `;
              }).join('')}
          </tbody>
        </table>
      </div>
      ${paginationBar(total, start, state.pageSize, state.page, totalPages, 'orders')}
    </div>
  `;
}

function paginationBar(total, start, pageSize, page, totalPages, scope) {
  return `
    <div class="flex flex-col sm:flex-row items-center justify-between gap-3 px-4 py-3" style="border-top: 1px solid var(--border); background: rgba(27,42,74,0.035);">
      <p class="text-xs" style="color: var(--sub);">
        Showing <span class="font-bold" style="color: var(--text);">${total === 0 ? 0 : start + 1}</span>–<span class="font-bold" style="color: var(--text);">${Math.min(start + pageSize, total)}</span> of <span class="font-bold" style="color: var(--text);">${formatNumber(total)}</span>
      </p>
      <div class="flex items-center gap-1">
        <button data-action="page" data-scope="${scope}" data-delta="-1" ${page <= 1 ? 'disabled' : ''} class="btn btn-ghost btn-sm"><i data-lucide="chevron-left" class="w-4 h-4"></i> Prev</button>
        <span class="text-xs px-3 py-1.5 font-semibold whitespace-nowrap" style="color: var(--sub);">Page ${page} / ${totalPages}</span>
        <button data-action="page" data-scope="${scope}" data-delta="1" ${page >= totalPages ? 'disabled' : ''} class="btn btn-ghost btn-sm">Next <i data-lucide="chevron-right" class="w-4 h-4"></i></button>
      </div>
    </div>
  `;
}

function filterSelect(label, stateKey, options) {
  const currentVal = state[stateKey];
  return `
    <div class="space-y-1.5">
      <label class="text-[11px] uppercase tracking-wide font-bold" style="color: var(--sub);">${esc(label)}</label>
      <select data-action="set-filter" data-key="${stateKey}" class="input h-9">
        <option value="">All</option>
        ${options.map(o => '<option value="' + attr(o) + '"' + (o === currentVal ? ' selected' : '') + '>' + esc(o) + '</option>').join('')}
      </select>
    </div>
  `;
}


// ============================================================
// ITEMS VIEW — global price index
// One row per customer + item: what they bought, at what price,
// and when. This is the fastest way to answer "what did we
// charge X for Y, and when?"
// ============================================================
function renderItemsContent() {
  const items = getFilteredItems();
  const total = items.length;
  const totalPages = Math.ceil(total / state.itemPageSize) || 1;
  if (state.itemPage > totalPages) state.itemPage = totalPages;
  if (state.itemPage < 1) state.itemPage = 1;
  const start = (state.itemPage - 1) * state.itemPageSize;
  const pageData = items.slice(start, start + state.itemPageSize);

  const allItems = buildItemIndex();
  const distinctDescriptions = new Set(allItems.map(i => normName(i.description))).size;
  const changed = allItems.filter(i => i.priceDelta != null && i.priceDelta !== 0).length;
  const priced = allItems.filter(i => i.lastPrice != null);
  const avgPrice = priced.length ? priced.reduce((s, i) => s + i.lastPrice, 0) / priced.length : null;

  const customerOptions = Array.from(new Set(allItems.map(i => i.customer))).sort();
  const productOptions = Array.from(new Set(allItems.map(i => i.productType).filter(Boolean))).sort();
  const activeFilters = [state.itemFilterProduct, state.itemFilterCustomer].filter(Boolean).length;

  const sortIcon = (field) => {
    if (state.itemSort !== field) return '<i data-lucide="chevrons-up-down" class="w-3 h-3" style="opacity:0.35"></i>';
    return '<i data-lucide="' + (state.itemSortDir === 'asc' ? 'arrow-up' : 'arrow-down') + '" class="w-3 h-3" style="color: var(--accent);"></i>';
  };
  const th = (field, label, cls) =>
    `<th class="${cls || ''}"><button class="sortbtn ${cls && cls.includes('text-right') ? 'ml-auto' : ''}" data-action="sort-item" data-field="${field}">${label} ${sortIcon(field)}</button></th>`;

  return `
    ${pageHeader('Items & Prices', 'Every item a customer has ordered, with its price and date')}

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4">
      ${kpiTile('primary', 'Customer / item pairs', formatNumber(allItems.length), null, 'd1')}
      ${kpiTile('violet', 'Distinct items', formatNumber(distinctDescriptions), null, 'd2')}
      ${kpiTile('accent', 'Avg unit price', avgPrice != null ? formatSAR(avgPrice) : DASH, null, 'd3')}
      ${kpiTile('danger', 'Price changed', formatNumber(changed), 'since the previous order', 'd4')}
    </div>

    <div class="card p-4 md:p-5 fade-up">
      <div class="flex flex-col md:flex-row gap-3 items-stretch">
        <div class="relative" style="flex: 1 1 340px; min-width: 0;">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4" style="color: var(--sub);"></i>
          <input id="item-search-input" type="text" aria-label="Search items" value="${attr(state.itemSearch)}" placeholder="Search an item or a customer — e.g. SOS BAG, or MESHRAQ..." class="input" style="padding-left: 38px;">
        </div>
        <div style="flex: 0 1 220px; min-width: 0;">
          <select data-action="set-item-filter" data-key="itemFilterCustomer" class="input" aria-label="Filter by customer">
            <option value="">All customers</option>
            ${customerOptions.map(c => '<option value="' + attr(c) + '"' + (c === state.itemFilterCustomer ? ' selected' : '') + '>' + esc(c) + '</option>').join('')}
          </select>
        </div>
        <div style="flex: 0 1 210px; min-width: 0;">
          <select data-action="set-item-filter" data-key="itemFilterProduct" class="input" aria-label="Filter by product type">
            <option value="">All product types</option>
            ${productOptions.map(p => '<option value="' + attr(p) + '"' + (p === state.itemFilterProduct ? ' selected' : '') + '>' + esc(p) + '</option>').join('')}
          </select>
        </div>
        ${activeFilters > 0 ? '<button data-action="clear-item-filters" class="btn btn-ghost shrink-0"><i data-lucide="x" class="w-4 h-4"></i> Clear</button>' : ''}
      </div>
    </div>

    ${total === 0
      ? emptyState('search-x', 'No items found', 'Nothing matches your search or filters. Try a shorter search term.')
      : `
    <div class="card overflow-hidden fade-up">
      <div class="overflow-x-auto scroll-thin">
        <table class="table">
          <thead>
            <tr>
              ${th('description', 'Item', 'min-w-[220px]')}
              ${th('customer', 'Customer', 'min-w-[150px]')}
              ${th('productType', 'Product', 'min-w-[150px]')}
              ${th('lastPrice', 'Last Unit Price', 'text-right w-36')}
              <th class="w-32">Change</th>
              ${th('lastDate', 'Last Ordered', 'w-32')}
              ${th('times', 'Times', 'text-right w-20')}
              ${th('totalValue', 'Lifetime Value', 'text-right w-36')}
            </tr>
          </thead>
          <tbody>
            ${pageData.map(i => `
              <tr data-action="open-item" data-item-key="${attr(i.key)}">
                <td class="text-sm font-semibold" style="color: var(--text);">${esc(i.description)}</td>
                <td class="text-sm whitespace-nowrap" style="color: var(--sub);">${esc(i.customer)}</td>
                <td class="whitespace-nowrap">${productChip(i.productType)}</td>
                <td class="text-right tabular-nums font-bold text-sm whitespace-nowrap" style="color: var(--primary);">${i.lastPrice != null ? formatSAR(i.lastPrice) : DASH}</td>
                <td class="whitespace-nowrap">${i.times > 1 ? trendBadge(i.priceDelta, i.prevPrice) : '<span class="text-[11px]" style="color: var(--muted);">first order</span>'}</td>
                <td class="text-xs whitespace-nowrap" style="color: var(--sub);">${formatDate(i.lastDate)}</td>
                <td class="text-right text-xs tabular-nums font-semibold" style="color: var(--text);">${i.times}</td>
                <td class="text-right tabular-nums text-sm font-semibold whitespace-nowrap" style="color: var(--text);">${formatSARShort(i.totalValue)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      ${paginationBar(total, start, state.itemPageSize, state.itemPage, totalPages, 'items')}
    </div>
    `}
  `;
}

// ============================================================
// ITEM HISTORY MODAL — full price timeline + cross-customer comparison
// ============================================================
function renderItemHistoryModal() {
  if (!state.selectedItemKey) return '';
  const entry = buildItemIndex().find(i => i.key === state.selectedItemKey);
  if (!entry) return '';

  const others = getItemAcrossCustomers(entry.description).filter(i => i.key !== entry.key);
  const meta = productMeta(entry.productType);

  // Oldest-first so each row can be compared against the one before it.
  const chrono = entry.history.slice().sort((a, b) => new Date(a.orderDate || 0) - new Date(b.orderDate || 0));

  return `
    <div class="modal-backdrop" role="dialog" aria-modal="true" data-action="close-item-backdrop">
      <div class="modal-content max-w-3xl max-h-[92vh] overflow-y-auto scroll-thin">
        <div class="modal-head p-6">
          <div class="flex items-start gap-4 relative" style="z-index:1;">
            <div class="avatar" style="width:48px;height:48px;background:${meta.bg};color:${meta.fg};border:1px solid ${meta.bd};box-shadow:none;">
              <i data-lucide="${meta.icon}" class="w-5 h-5"></i>
            </div>
            <div class="flex-1 min-w-0">
              <p class="mh-title text-xl font-bold leading-tight">${esc(entry.description)}</p>
              <p class="mh-sub text-sm mt-0.5">${esc(entry.customer)} · ${esc(entry.productType) || 'No product type'}</p>
            </div>
            <button data-action="close-item" class="btn btn-ghost btn-sm shrink-0"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
        </div>

        <div class="p-6 space-y-5">
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            ${miniStat('Last price', entry.lastPrice != null ? formatSAR(entry.lastPrice) : DASH, 'var(--primary)')}
            ${miniStat('Last ordered', formatDate(entry.lastDate), 'var(--text)')}
            ${miniStat('Lowest', entry.minPrice != null ? formatSAR(entry.minPrice) : DASH, entry.minPrice === entry.maxPrice ? 'var(--text)' : 'var(--success)')}
            ${miniStat('Highest', entry.maxPrice != null ? formatSAR(entry.maxPrice) : DASH, entry.minPrice === entry.maxPrice ? 'var(--text)' : 'var(--danger)')}
          </div>

          <div>
            <h3 class="text-xs font-bold uppercase tracking-wider mb-2" style="color: var(--sub);">Price history · ${entry.times} order${entry.times === 1 ? '' : 's'}</h3>
            <div class="table-wrap">
              <div>
              <table class="table table-embed">
                <thead>
                  <tr>
                    <th>Date</th><th>Order</th><th class="text-right">Qty</th>
                    <th class="text-right">Unit Price</th><th class="text-right">Total</th><th>vs previous</th>
                  </tr>
                </thead>
                <tbody>
                  ${chrono.map((h, idx) => {
                    const prev = idx > 0 ? chrono[idx - 1] : null;
                    const delta = (prev && prev.unitPrice != null && h.unitPrice != null) ? h.unitPrice - prev.unitPrice : null;
                    const typedDiffers = normName(h.typedName) !== normName(entry.customer);
                    return `
                      <tr data-action="open-order" data-order-id="${attr(h.orderId)}">
                        <td class="whitespace-nowrap text-xs" style="color: var(--sub);">${formatDate(h.orderDate)}</td>
                        <td class="font-mono text-xs font-bold whitespace-nowrap" style="color: var(--primary);">
                          ${esc(h.orderId)}
                          ${typedDiffers ? '<span class="alias-tag" style="margin-left:5px;">' + esc(h.typedName) + '</span>' : ''}
                        </td>
                        <td class="text-right tabular-nums text-xs whitespace-nowrap">${formatNumber(h.quantity)} <span style="color:var(--muted);">${esc(h.qtyUnit)}</span></td>
                        <td class="text-right tabular-nums font-bold whitespace-nowrap">${h.unitPrice != null ? formatSAR(h.unitPrice) : DASH}</td>
                        <td class="text-right tabular-nums whitespace-nowrap">${formatSAR(h.totalValue)}</td>
                        <td class="whitespace-nowrap">${idx === 0 ? '<span class="text-[11px]" style="color:var(--muted);">first</span>' : trendBadge(delta, prev.unitPrice)}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
              </div>
            </div>
          </div>

          ${others.length > 0 ? `
          <div>
            <h3 class="text-xs font-bold uppercase tracking-wider mb-2" style="color: var(--sub);">Other customers buying "${esc(entry.description)}"</h3>
            <div class="space-y-1.5">
              ${others.map(o => {
                const diff = (entry.lastPrice != null && o.lastPrice != null) ? o.lastPrice - entry.lastPrice : null;
                return `
                  <button data-action="open-item" data-item-key="${attr(o.key)}" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left" style="border: 1px solid var(--border); background: rgba(255,255,255,0.6);">
                    <i data-lucide="user" class="w-3.5 h-3.5 shrink-0" style="color: var(--muted);"></i>
                    <span class="text-sm font-semibold flex-1 truncate" style="color: var(--text);">${esc(o.customer)}</span>
                    <span class="text-xs" style="color: var(--sub);">${formatDate(o.lastDate)}</span>
                    <span class="text-sm font-bold tabular-nums" style="color: var(--primary);">${o.lastPrice != null ? formatSAR(o.lastPrice) : DASH}</span>
                    ${diff != null && diff !== 0
                      ? '<span class="text-[11px] font-bold ' + (diff > 0 ? 'trend-up' : 'trend-down') + '">' + (diff > 0 ? '+' : '−') + formatNumber(Math.abs(diff), 2) + '</span>'
                      : '<span class="text-[11px] trend-flat font-semibold">same</span>'}
                  </button>
                `;
              }).join('')}
            </div>
          </div>
          ` : ''}
        </div>

        <div class="p-5 flex gap-2 justify-end" style="border-top: 1px solid var(--border); background: rgba(27,42,74,0.035);">
          <button data-action="item-view-orders" data-customer="${attr(entry.customer)}" class="btn btn-ghost"><i data-lucide="clipboard-list" class="w-4 h-4"></i> View customer orders</button>
          <button data-action="close-item" class="btn btn-primary">Close</button>
        </div>
      </div>
    </div>
  `;
}

function miniStat(label, value, color) {
  return `
    <div class="rounded-2xl p-3" style="border: 1px solid var(--border); background: rgba(255,255,255,0.65);">
      <p class="text-[10px] uppercase tracking-wide font-bold mb-1" style="color: var(--sub);">${esc(label)}</p>
      <p class="text-base font-bold tabular-nums" style="color: ${color};">${value}</p>
    </div>
  `;
}


// ============================================================
// CUSTOMERS VIEW — grouped list, merge tool, 360° profile
// ============================================================
function customerInitials(name) {
  const parts = String(name || '?').trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function renderCustomersContent() {
  const list = getCustomerList();
  const allList = getCustomerList({ skipSearch: true });
  const totalValue = allList.reduce((s, c) => s + c.totalValue, 0);
  const withOverdue = allList.filter(c => c.overdueCount > 0).length;
  const mergedCount = allList.filter(c => c.brands.length > 1).length;
  const suggestions = findDuplicateSuggestions();

  return `
    ${pageHeader('Customers', 'Companies, their brand names and full order history')}

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4">
      ${kpiTile('primary', 'Customers', formatNumber(allList.length), null, 'd1')}
      ${kpiTile('accent', 'Combined value', formatSARShort(totalValue), null, 'd2')}
      ${kpiTile('violet', 'Multi-brand', formatNumber(mergedCount), mergedCount ? 'companies with 2+ brands' : 'no companies named yet', 'd3')}
      ${kpiTile('danger', 'With overdue', formatNumber(withOverdue), null, 'd4')}
    </div>

    ${suggestions.length > 0 ? `
      <div class="banner fade-up">
        <div class="flex items-start gap-3">
          <div class="kpi-icon icon-accent shrink-0" style="width:38px;height:38px;border-radius:12px;"><i data-lucide="building-2" class="w-4 h-4"></i></div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-bold" style="color: var(--text);">${suggestions.length} possible multi-brand compan${suggestions.length === 1 ? 'y' : 'ies'} found</p>
            <p class="text-xs mt-0.5" style="color: var(--sub);">These names share a customer number or look nearly identical, so they are probably brands of one company. You can ignore this and group any names you like.</p>
            ${state.showMergeSuggestions ? `
              <div class="mt-3 space-y-2">
                ${suggestions.map((s, idx) => `
                  <div class="rounded-xl p-3 flex flex-col sm:flex-row sm:items-center gap-2" style="background: rgba(255,255,255,0.72); border: 1px solid var(--border);">
                    <div class="flex-1 min-w-0">
                      <div class="flex flex-wrap gap-1.5 mb-1">
                        ${s.names.map(n => '<span class="chip chip-neutral" style="font-size:11px;padding:2px 9px;">' + esc(n) + '</span>').join('')}
                      </div>
                      <p class="text-[11px]" style="color: var(--muted);">${esc(s.detail)}</p>
                    </div>
                    <button data-action="merge-from-suggestion" data-idx="${idx}" class="btn btn-accent btn-sm shrink-0"><i data-lucide="building-2" class="w-3.5 h-3.5"></i> Name this company</button>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
          <button data-action="toggle-suggestions" class="btn btn-ghost btn-sm shrink-0">${state.showMergeSuggestions ? 'Hide' : 'Review'}</button>
        </div>
      </div>
    ` : ''}

    <div class="card p-4 md:p-5 fade-up">
      <div class="flex flex-col md:flex-row gap-3">
        <div class="relative flex-1">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4" style="color: var(--sub);"></i>
          <input id="customer-search-input" type="text" aria-label="Search customers" value="${attr(state.customerSearch)}" placeholder="Search by company, brand name, customer number or phone..." class="input" style="padding-left: 38px;">
        </div>
        <button data-action="open-merge" class="btn btn-primary shrink-0"><i data-lucide="building-2" class="w-4 h-4"></i> Name a company</button>
      </div>
    </div>

    <div class="space-y-2 fade-up">
      ${list.length === 0
        ? emptyState('user-x', 'No customers found', 'Nothing matches your search.')
        : list.map(c => `
          <div class="card card-hover w-full p-4 flex items-center gap-4" data-action="open-customer" data-customer="${attr(c.customerName)}">
            <div class="avatar text-sm" style="width:46px;height:46px;">${esc(customerInitials(c.customerName))}</div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <p class="text-sm font-bold truncate" style="color: var(--text);">${esc(c.customerName)}</p>
                ${c.category ? '<span class="chip chip-info chip-plain" style="font-size:10px; padding:2px 8px;">' + esc(c.category) + '</span>' : ''}
                ${c.brands.length > 1 ? '<span class="alias-tag"><i data-lucide="tags" class="w-2.5 h-2.5"></i>' + c.brands.length + ' brands</span>' : ''}
                ${c.overdueCount > 0 ? '<span class="chip chip-danger" style="font-size:10px; padding:2px 8px;">' + c.overdueCount + ' overdue</span>' : ''}
              </div>
              <p class="text-xs mt-0.5" style="color: var(--sub);">${c.customerNumber ? '#' + esc(c.customerNumber) + ' · ' : ''}${c.orders} order${c.orders === 1 ? '' : 's'} · last ${formatDate(c.lastOrderDate)}</p>
              ${c.brands.length > 1 ? '<p class="text-[10.5px] mt-1 truncate" style="color: var(--violet);">' + esc(c.brands.join(' · ')) + '</p>' : ''}
            </div>
            <div class="text-right shrink-0">
              <p class="text-sm font-bold tabular-nums" style="color: var(--primary);">${formatSARShort(c.totalValue)}</p>
              <p class="text-[11px]" style="color: var(--sub);">avg ${formatSARShort(c.avgOrder)}</p>
            </div>
            <button data-action="rename-company" data-customer="${attr(c.customerName)}" title="Rename this company" class="btn btn-ghost btn-sm shrink-0" style="padding:7px;"><i data-lucide="building-2" class="w-3.5 h-3.5"></i></button>
            <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: var(--muted);"></i>
          </div>
        `).join('')}
    </div>
  `;
}

// ============================================================
// COMPANY MODAL — set the master company name for one or more brands
// ------------------------------------------------------------
// A company may trade under several brand names. Pick the brands,
// then TYPE the master company name. One brand is enough — naming a
// single-brand company is just a rename. The typed name is free text
// and has nothing to do with customer numbers.
// ============================================================
function renderMergeModal() {
  if (!state.mergeOpen) return '';
  const list = getCustomerList({ skipSearch: true });
  const selected = state.mergeSelected.filter(n => list.some(c => normName(c.customerName) === normName(n)));
  const selectedEntries = selected.map(n => list.find(c => normName(c.customerName) === normName(n))).filter(Boolean);
  const affectedOrders = selectedEntries.reduce((s, c) => s + c.orders, 0);
  const affectedValue = selectedEntries.reduce((s, c) => s + c.totalValue, 0);
  const brandCount = selectedEntries.reduce((s, c) => s + Math.max(1, c.brands.length), 0);
  const target = state.mergeTargetName.trim();
  const renaming = !!state.mergeRenameOf;
  // One brand is enough. Naming a single-brand company is a rename.
  const unchanged = renaming && normName(target) === normName(state.mergeRenameOf);
  const canApply = selected.length >= 1 && target.length > 0 && !unchanged;

  const heading = renaming ? 'Rename company' : 'Set master company name';
  const blurb = renaming
    ? 'Type the new master company name. Every brand under it follows automatically, and your orders are not touched.'
    : 'A company can trade under several brand names. Tick its brands, then type the master company name you want to see on this tab. Your orders always keep the brand name you typed on them.';

  return `
    <div class="modal-backdrop" role="dialog" aria-modal="true" data-action="close-merge-backdrop">
      <div class="modal-content max-w-2xl max-h-[92vh] flex flex-col">
        <div class="modal-head p-6 shrink-0">
          <div class="relative" style="z-index:1;">
            <h2 class="mh-title text-xl font-bold">${heading}</h2>
            <p class="mh-sub text-sm mt-1">${blurb}</p>
          </div>
        </div>

        <div class="p-6 space-y-4 overflow-y-auto scroll-thin flex-1">
          ${renaming ? `
            <div class="rounded-2xl p-3 flex items-center gap-3" style="background: var(--violet-soft); border: 1px solid rgba(124,77,190,0.26);">
              <i data-lucide="building-2" class="w-4 h-4 shrink-0" style="color: var(--violet);"></i>
              <p class="text-sm" style="color: var(--sub);">Renaming <span class="font-bold" style="color: var(--text);">${esc(state.mergeRenameOf)}</span>${selectedEntries[0] && selectedEntries[0].brands.length > 1 ? ' and its ' + selectedEntries[0].brands.length + ' brands' : ''}.</p>
            </div>
          ` : `
            <div class="space-y-1.5">
              <label class="text-xs font-bold uppercase tracking-wide" style="color: var(--sub);">1. Tick this company's brands</label>
              <input id="merge-search" type="text" value="${attr(state.mergeSearch || '')}" placeholder="Filter the list..." class="input">
              <p class="text-[11px]" style="color: var(--muted);">Tick one brand to simply rename it, or several to put them under one company. Brands do not need the same customer number.</p>
            </div>

            <div class="rounded-2xl overflow-hidden" style="border: 1px solid var(--border); max-height: 250px; overflow-y: auto;">
              ${list
                .filter(c => !state.mergeSearch || c.customerName.toLowerCase().includes(state.mergeSearch.toLowerCase()) || c.aliases.some(a => a.toLowerCase().includes(state.mergeSearch.toLowerCase())))
                // Ticked names stay pinned to the top while you type the company name.
                .sort((a, b) => {
                  const sa = selected.some(n => normName(n) === normName(a.customerName)) ? 0 : 1;
                  const sb = selected.some(n => normName(n) === normName(b.customerName)) ? 0 : 1;
                  return sa !== sb ? sa - sb : b.totalValue - a.totalValue;
                })
                .map(c => {
                  const on = selected.some(n => normName(n) === normName(c.customerName));
                  return `
                    <div data-action="toggle-merge-pick" data-customer="${attr(c.customerName)}" class="flex items-center gap-3 px-4 py-2.5 cursor-pointer" style="border-bottom: 1px solid var(--border); background: ${on ? 'rgba(127,168,255,0.14)' : 'transparent'};">
                      <div class="checkbox ${on ? 'on' : ''}"></div>
                      <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold truncate" style="color: var(--text);">${esc(c.customerName)}</p>
                        <p class="text-[11px]" style="color: var(--sub);">${c.customerNumber ? '#' + esc(c.customerNumber) + ' · ' : ''}${c.orders} orders · ${formatSARShort(c.totalValue)}</p>
                        ${c.brands.length > 1 ? '<p class="text-[10.5px] mt-0.5 truncate" style="color: var(--violet);">brands: ' + esc(c.brands.join(', ')) + '</p>' : ''}
                      </div>
                    </div>
                  `;
                }).join('')}
            </div>
          `}

          <div class="space-y-1.5">
            <label class="text-xs font-bold uppercase tracking-wide" style="color: var(--sub);">${renaming ? 'New master company name' : '2. Type the master company name'}</label>
            <input id="merge-target" type="text" value="${attr(state.mergeTargetName)}" placeholder="e.g. AL SHISHITO GROUP — type any name you want" class="input" autocapitalize="characters">
            <p class="text-[11px]" style="color: var(--muted);">Free text. It does not have to match any brand name or customer number.</p>
            ${!renaming && selectedEntries.length > 0 ? `
              <div class="flex flex-wrap gap-1.5 pt-1">
                ${selectedEntries.map(c => '<button data-action="use-merge-name" data-customer="' + attr(c.customerName) + '" class="chip chip-neutral chip-plain" style="cursor:pointer;font-size:11px;">use "' + esc(c.customerName) + '"</button>').join('')}
              </div>
            ` : ''}
          </div>

          ${canApply ? `
            <div class="banner">
              <p class="text-sm font-bold mb-1" style="color: var(--text);">Preview</p>
              <p class="text-xs" style="color: var(--sub);">
                <span class="font-bold" style="color: var(--primary);">${esc(target.toUpperCase())}</span> —
                <span class="font-bold" style="color: var(--text);">${brandCount}</span> brand${brandCount === 1 ? '' : 's'} ·
                <span class="font-bold" style="color: var(--text);">${affectedOrders}</span> orders ·
                <span class="font-bold" style="color: var(--text);">${formatSARShort(affectedValue)}</span>
              </p>
              <p class="text-[11px] mt-1" style="color: var(--muted);">The Orders tab is unchanged — every order keeps the brand name you typed on it.</p>
            </div>
          ` : `
            <p class="text-xs" style="color: var(--muted);">${unchanged ? 'That is already the company name — type a different one.' : (renaming ? 'Type a company name to continue.' : 'Tick at least one brand and type a company name to continue.')}</p>
          `}
        </div>

        <div class="p-5 flex gap-2 justify-end shrink-0" style="border-top: 1px solid var(--border); background: rgba(27,42,74,0.035);">
          <button data-action="close-merge" class="btn btn-ghost">Cancel</button>
          <button data-action="confirm-merge" class="btn btn-primary" ${canApply ? '' : 'disabled'}><i data-lucide="building-2" class="w-4 h-4"></i> Review &amp; apply</button>
        </div>
      </div>
    </div>
  `;
}

  const company = state.addBrandTo;

    .filter(c => normName(c.customerName) !== normName(company));

        </div>
        <div class="px-6 pb-6 overflow-y-auto scroll-thin flex-1">
          <div class="rounded-2xl overflow-hidden" style="border: 1px solid var(--border);">

                <div data-action="pick-brand" data-customer="${attr(c.customerName)}" class="flex items-center gap-3 px-4 py-2.5 cursor-pointer" style="border-bottom: 1px solid var(--border);">
                  <i data-lucide="plus-circle" class="w-4 h-4 shrink-0" style="color: var(--violet);"></i>
                  <div class="flex-1 min-w-0">
                    <p class="text-sm font-semibold truncate" style="color: var(--text);">${esc(c.customerName)}</p>
                    <p class="text-[11px]" style="color: var(--sub);">${c.customerNumber ? '#' + esc(c.customerNumber) + ' · ' : ''}${c.orders} orders · ${formatSARShort(c.totalValue)}${c.aliases.length ? ' · brings ' + c.aliases.length + ' brand' + (c.aliases.length === 1 ? '' : 's') : ''}</p>

              `).join('')}

  `;
