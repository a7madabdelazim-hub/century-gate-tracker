// Final confirmation before anything is written.
function showMergeConfirm(sourceNames, targetName) {
  const list = getCustomerList({ skipSearch: true });
  const entries = sourceNames
    .map(n => list.find(c => normName(c.customerName) === normName(n)))
    .filter(Boolean);
  const totalOrders = entries.reduce((s, c) => s + c.orders, 0);
  const totalValue = entries.reduce((s, c) => s + c.totalValue, 0);
  const target = targetName.trim().toUpperCase();
  const isRename = entries.length === 1;
  const allBrands = [];
  entries.forEach(c => {
    if (c.brands.length) allBrands.push.apply(allBrands, c.brands);
    else allBrands.push(c.customerName);
  });

  const container = document.createElement('div');
  container.className = 'modal-backdrop';
  container.setAttribute('role', 'dialog');
  container.setAttribute('aria-modal', 'true');
  container.style.zIndex = '120';
  container.innerHTML = `
    <div class="modal-content max-w-lg w-full">
      <div class="p-6">
        <div class="flex items-center gap-3 mb-4">
          <div class="kpi-icon icon-accent shrink-0" style="border-radius:14px;"><i data-lucide="building-2" class="w-5 h-5"></i></div>
          <h3 class="text-lg font-bold" style="color: var(--text);">${isRename ? 'Confirm company name' : 'Confirm company grouping'}</h3>
        </div>
        <p class="text-sm mb-3" style="color: var(--sub);">
          ${isRename
            ? 'This will appear on the Customers tab as <span class="font-bold" style="color: var(--primary);">' + esc(target) + '</span>:'
            : 'These ' + entries.length + ' will become one company named <span class="font-bold" style="color: var(--primary);">' + esc(target) + '</span>:'}
        </p>
        <div class="rounded-2xl overflow-hidden mb-4" style="border: 1px solid var(--border); max-height: 200px; overflow-y: auto;">
          ${entries.map(c => `
            <div class="flex items-center gap-3 px-4 py-2.5" style="border-bottom: 1px solid var(--border);">
              <span class="text-sm font-semibold flex-1 truncate" style="color: var(--text);">${esc(c.customerName)}</span>
              <span class="text-xs" style="color: var(--sub);">${c.orders} orders</span>
              <span class="text-sm font-bold tabular-nums" style="color: var(--primary);">${formatSARShort(c.totalValue)}</span>
            </div>
          `).join('')}
        </div>
        <div class="rounded-xl p-3 mb-4" style="background: var(--info-soft); border: 1px solid var(--info-line);">
          <p class="text-xs font-semibold mb-1" style="color: var(--info);">What happens</p>
          <ul class="text-xs space-y-1" style="color: var(--sub); list-style: disc; padding-left: 16px;">
            <li>The Customers tab shows one company: <span class="font-bold">${esc(target)}</span>, with ${allBrands.length} brand${allBrands.length === 1 ? '' : 's'} under it.</li>
            <li><span class="font-bold">${totalOrders}</span> orders worth <span class="font-bold">${formatSARShort(totalValue)}</span> roll up into it.</li>
            <li>Your orders are <span class="font-bold">not changed</span> — the Orders tab still shows the brand name you typed.</li>
            <li>Any future order typed with one of these brand names lands under <span class="font-bold">${esc(target)}</span> automatically.</li>
            <li>You can rename the company or remove a brand at any time from its profile.</li>
          </ul>
        </div>
        <div class="flex gap-2 justify-end">
          <button id="merge-cancel" class="btn btn-ghost">Cancel</button>
          <button id="merge-apply" class="btn btn-primary"><i data-lucide="check" class="w-4 h-4"></i> ${isRename ? 'Yes, use this name' : 'Yes, group them'}</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(container);
  if (window.lucide) lucide.createIcons();

  const close = () => container.remove();
  container.addEventListener('click', (e) => { if (e.target === container) close(); });
  container.querySelector('#merge-cancel').addEventListener('click', close);
  container.querySelector('#merge-apply').addEventListener('click', () => {
    close();
    mergeCustomers(sourceNames, target);
    state.mergeOpen = false;
    state.mergeSelected = [];
    state.mergeTargetName = '';
    state.mergeSearch = '';
    state.mergeRenameOf = null;
    state.selectedCustomerName = target;
    toast(isRename ? 'Company named' : 'Company created',
          target + ' now covers ' + allBrands.length + ' brand' + (allBrands.length === 1 ? '' : 's') + ' and ' + totalOrders + ' orders.');
    render();
  });
}

// ============================================================
function renderCustomerDetailModal() {
  if (!state.selectedCustomerName) return '';
  const list = getCustomerList({ skipSearch: true });
  const c = list.find(x => normName(x.customerName) === normName(state.selectedCustomerName));
  if (!c) return '';

  const orders = state.orders
    .filter(o => normName(resolveCustomerName(o.customerName)) === normName(c.customerName))
    .sort((a, b) => new Date(b.orderDate || 0) - new Date(a.orderDate || 0));
  const items = getCustomerItems(c.customerName);

  function contactRow(icon, value) {
    if (!value) return '';
    return '<div class="flex items-center gap-2 text-sm" style="color: var(--text);"><i data-lucide="' + icon + '" class="w-3.5 h-3.5 shrink-0" style="color: var(--sub);"></i><span>' + esc(value) + '</span></div>';
  }

  return `
    <div class="modal-backdrop" role="dialog" aria-modal="true" data-action="close-customer-backdrop">
      <div class="modal-content max-w-3xl max-h-[92vh] overflow-y-auto scroll-thin">
        <div class="modal-head p-6">
          <div class="flex items-start gap-4 relative" style="z-index:1;">
            <div class="avatar text-lg" style="width:54px;height:54px;background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.3);color:#fff;">${esc(customerInitials(c.customerName))}</div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="mh-title text-xl font-bold">${esc(c.customerName)}</span>
                ${c.category ? '<span class="chip chip-plain" style="background:rgba(255,255,255,0.2);color:#fff;border-color:rgba(255,255,255,0.3);font-size:11px;">' + esc(c.category) + '</span>' : ''}
              </div>
              <p class="mh-sub text-sm mt-0.5">${c.numbers.length ? 'Customer ' + c.numbers.map(n => '#' + esc(n)).join(' · ') : 'No customer number on file'}</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-1.5 shrink-0">
              <button data-action="rename-company" data-customer="${attr(c.customerName)}" class="btn btn-ghost btn-sm"><i data-lucide="building-2" class="w-3.5 h-3.5"></i> Rename</button>
              <button data-action="edit-customer" data-customer="${attr(c.customerName)}" class="btn btn-ghost btn-sm"><i data-lucide="pencil" class="w-3.5 h-3.5"></i> Details</button>
            </div>
          </div>
        </div>

        <div class="p-6 space-y-5">
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            ${miniStat('Total orders', String(c.orders), 'var(--text)')}
            ${miniStat('Total value', formatSARShort(c.totalValue), 'var(--primary)')}
            ${miniStat('Avg order', formatSARShort(c.avgOrder), 'var(--text)')}
            ${miniStat('Last order', formatDate(c.lastOrderDate), 'var(--text)')}
          </div>

          <div class="rounded-2xl p-4" style="background: var(--violet-soft); border: 1px solid rgba(124,77,190,0.26);">
            <div class="flex items-center justify-between gap-2 mb-2 flex-wrap">
              <div class="flex items-center gap-2">
                <i data-lucide="tags" class="w-3.5 h-3.5" style="color: var(--violet);"></i>
                <h3 class="text-xs font-bold uppercase tracking-wider" style="color: var(--violet);">Brands under this company (${c.brands.length || 1})</h3>
              </div>
              <button data-action="add-brand" data-customer="${attr(c.customerName)}" class="btn btn-ghost btn-sm"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Add brand</button>
            </div>
            <p class="text-[11px] mb-2.5" style="color: var(--sub);">
              ${c.brands.length > 1
                ? 'Orders typed under these brand names roll up into ' + esc(c.customerName) + '. Remove one to make it its own company again.'
                : 'This company trades under one name only. Add a brand to put another name under it.'}
            </p>
            <div class="flex flex-wrap gap-1.5">
              ${(c.brands.length ? c.brands : [c.customerName]).map(a => {
                const removable = normName(a) !== normName(c.customerName);
                return `
                <span class="alias-tag" style="padding:4px 6px 4px 9px;">
                  ${esc(a)}
                  ${removable ? `
                  <button data-action="unmerge-alias" data-alias="${attr(a)}" title="Make ${attr(a)} its own company again" style="display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:5px;border:none;background:rgba(124,77,190,0.20);color:var(--violet);cursor:pointer;margin-left:1px;">
                    <i data-lucide="x" class="w-2.5 h-2.5" style="pointer-events:none;"></i>
                  </button>` : ''}
                </span>
              `; }).join('')}
            </div>

          ${(c.phone || c.email || c.address || c.salesperson) ? `
          <div>
            <h3 class="text-xs font-bold uppercase tracking-wider mb-2" style="color: var(--sub);">Contact information</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
              ${contactRow('phone', c.phone)}
              ${contactRow('mail', c.email)}
              ${contactRow('map-pin', c.address)}
              ${contactRow('user', c.salesperson)}
            </div>
          </div>

          ${c.notes ? `
          <div>
            <h3 class="text-xs font-bold uppercase tracking-wider mb-2" style="color: var(--sub);">Notes</h3>

          </div>
          ` : ''}

                  <tr><th>Item</th><th class="text-right">Last price</th><th>Last date</th><th class="text-right">Times</th><th>Change</th></tr>
                </thead>
                <tbody>
                  ${items.length === 0
                    ? '<tr><td colspan="5" class="text-center py-6" style="color: var(--muted);">No items recorded.</td></tr>'
                    : items.map(i => `
                      <tr data-action="open-item" data-item-key="${attr(i.key)}">
                        <td class="text-xs font-semibold" style="color: var(--text);">
                          ${esc(i.description)}
                          <span class="block text-[10px] font-normal mt-0.5" style="color: var(--muted);">${esc(i.productType)}</span>
                        </td>
                        <td class="text-right tabular-nums font-bold text-xs whitespace-nowrap" style="color: var(--primary);">${i.lastPrice != null ? formatSAR(i.lastPrice) : DASH}</td>
                        <td class="text-xs whitespace-nowrap" style="color: var(--sub);">${formatDate(i.lastDate)}</td>

          <div>
            <div class="flex items-center justify-between mb-2 gap-2">
              <h3 class="text-xs font-bold uppercase tracking-wider" style="color: var(--sub);">Order history (${orders.length})</h3>
              <button data-action="customer-view-orders" data-customer="${attr(c.customerName)}" class="text-xs font-bold" style="color: var(--primary);">View in Orders →</button>
            </div>
            <div class="space-y-1 max-h-72 overflow-y-auto scroll-thin">
              ${orders.map(o => {
                const overdue = isOverdue(o.deadline, o.deliveryStatus);
                const typed = (o.customerName || '').trim();
                const differs = normName(typed) !== normName(c.customerName);
                return `
                  <div data-action="open-order" data-order-id="${attr(o.orderId)}" class="w-full flex items-center gap-3 px-2.5 py-2 rounded-xl text-left cursor-pointer" style="border-bottom: 1px solid var(--border);">
                    <i data-lucide="${overdue ? 'alert-triangle' : 'clipboard-list'}" class="w-3.5 h-3.5 shrink-0" style="color: ${overdue ? 'var(--danger)' : 'var(--muted)'}"></i>
                    <div class="w-24 shrink-0">
                      <p class="text-xs font-mono font-bold" style="color: var(--primary);">${esc(o.orderId)}</p>
                      <p class="text-[10px]" style="color: var(--sub);">${formatDate(o.orderDate)}</p>
                    </div>
                    <div class="flex-1 min-w-0">
                      <p class="text-xs truncate" style="color: var(--text);">${dash(esc(o.description))}</p>
                      ${differs ? '<span class="alias-tag mt-0.5"><i data-lucide="corner-down-right" class="w-2.5 h-2.5"></i>' + esc(typed) + '</span>' : ''}
                    </div>
                    <span class="text-xs font-bold tabular-nums shrink-0" style="color: var(--text);">${formatSARShort(o.totalValue)}</span>
                    <span class="shrink-0">${statusChip(o.productionStatus)}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>

        <div class="p-5 flex gap-2 justify-end" style="border-top: 1px solid var(--border); background: rgba(27,42,74,0.035);">
          <button data-action="close-customer" class="btn btn-primary">Close</button>
        </div>
      </div>
    </div>
  `;
}

// CUSTOMER CONTACT FORM

function renderCustomerFormModal() {
  if (!state.customerFormMode) return '';
  const master = getCustomerMaster(state.customerFormName) || {};

  function inputField(label, name, value, placeholder, autoUpper) {
    const upperAttrs = autoUpper ? ' data-upper="1" autocapitalize="characters"' : '';
    return '<div class="space-y-1.5"><label class="text-xs font-semibold" style="color: var(--text);">' + esc(label) + '</label>' +

function saveCustomerForm() {
  const formEl = document.getElementById('customer-form');
  if (!formEl) return;
  const fd = new FormData(formEl);
  const data = { customerName: state.customerFormName };
  for (const [key, value] of fd.entries()) data[key] = String(value).trim();
  ['category', 'salesperson', 'address'].forEach(k => { if (data[k]) data[k] = data[k].toUpperCase(); });
  upsertCustomerMaster(data);
  toast('Customer updated', data.customerName + ' contact info saved.');
  state.customerFormMode = null;
  state.selectedCustomerName = data.customerName;
  render();
}

function toDateInput(value) {
  const d = new Date(value);
  if (isNaN(d.getTime())) return '';
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

function updateLastPriceHint() {
  const formEl = document.getElementById('order-form');
  const hintEl = document.getElementById('last-price-hint');
  const noteEl = document.getElementById('customer-group-note');
  if (!formEl || !hintEl) return;

  const customer = (formEl.querySelector('[name="customerName"]') || {}).value || '';
  const description = (formEl.querySelector('[name="description"]') || {}).value || '';

  if (noteEl) {
    const trimmed = customer.trim();
    const grouped = resolveCustomerName(trimmed);
    noteEl.innerHTML = (trimmed && normName(grouped) !== normName(trimmed))
      ? '<i data-lucide="git-merge" class="w-3 h-3 inline-block align-[-1px]"></i> This name is merged — the order will appear under <span class="font-bold">' + esc(grouped) + '</span> on the Customers tab.'
      : '';
  }

  const found = findLastPrice(customer, description);
  if (!found) {
    hintEl.innerHTML = (customer.trim() && description.trim())
      ? '<div class="rounded-xl px-3 py-2 text-[11px]" style="background: rgba(27,42,74,0.045); border: 1px solid var(--border); color: var(--muted);"><i data-lucide="info" class="w-3 h-3 inline-block align-[-1px]"></i> No previous price on record for this customer and item.</div>'
      : '';
    if (window.lucide) lucide.createIcons();
    return;
  }

  const o = found.order;
  const exact = found.match === 'exact';
  hintEl.innerHTML = `
    <div class="rounded-xl p-3 flex flex-col sm:flex-row sm:items-center gap-2" style="background: linear-gradient(120deg, rgba(232,192,74,0.20), rgba(127,168,255,0.16)); border: 1px solid rgba(201,162,39,0.34);">
      <div class="flex items-start gap-2 flex-1 min-w-0">
        <i data-lucide="history" class="w-4 h-4 shrink-0 mt-0.5" style="color: #A8811A;"></i>
        <div class="min-w-0">
          <p class="text-xs font-bold" style="color: var(--text);">
            Last price ${exact ? '' : '(similar item) '}· ${formatSAR(o.unitPrice)}
            <span class="font-normal" style="color: var(--sub);">on ${formatDate(o.orderDate)}</span>
          </p>
          <p class="text-[11px] truncate" style="color: var(--sub);">${esc(o.customerName)} · ${esc(o.description)} · ${formatNumber(o.quantity)} ${esc(o.qtyUnit)} · ${esc(o.orderId)}</p>
        </div>
      </div>
      <button type="button" data-action="use-last-price" data-price="${attr(o.unitPrice)}" data-product="${attr(o.productType)}" data-unit="${attr(o.qtyUnit)}" class="btn btn-accent btn-sm shrink-0"><i data-lucide="arrow-down-to-line" class="w-3.5 h-3.5"></i> Use this price</button>
    </div>
  `;
  if (window.lucide) lucide.createIcons();
}

// ============================================================
// FORM HELPERS
// ============================================================
function upperOnInput(el) {
  const start = el.selectionStart, end = el.selectionEnd;
  const upper = el.value.toUpperCase();
  if (upper === el.value) return;
  el.value = upper;
  if (start != null && end != null) {
    try { el.setSelectionRange(start, end); } catch (e) { /* not selectable */ }
  }
}

function sanitizeDecimal(value) {
  let cleaned = String(value).replace(/[^0-9.]/g, '');
  const parts = cleaned.split('.');
  if (parts.length > 2) cleaned = parts[0] + '.' + parts.slice(1).join('');
  return cleaned;
}

function recalcTotalValue() {
  const formEl = document.getElementById('order-form');
  if (!formEl) return;
  const qtyInput = formEl.querySelector('[name="quantity"]');
  const priceInput = formEl.querySelector('[name="unitPrice"]');
  const clicheInput = formEl.querySelector('[name="clicheValue"]');
  const totalInput = formEl.querySelector('[name="totalValue"]');
  if (!qtyInput || !priceInput || !totalInput) return;
  const qty = parseFloat(qtyInput.value);
  const price = parseFloat(priceInput.value);
  const cliche = clicheInput ? (parseFloat(clicheInput.value) || 0) : 0;
  if (qtyInput.value.trim() === '' || priceInput.value.trim() === '' || isNaN(qty) || isNaN(price)) {
    totalInput.value = cliche ? cliche.toFixed(2) : '';
    return;
  }
  totalInput.value = (qty * price + cliche).toFixed(2);
}

function saveForm() {
  const formEl = document.getElementById('order-form');
  if (!formEl) return;
  const fd = new FormData(formEl);
  const data = {};
  for (const [key, value] of fd.entries()) data[key] = String(value).trim();
  ['orderId', 'customerName', 'description'].forEach(k => { if (data[k]) data[k] = data[k].toUpperCase(); });

  if (!data.orderId) { toast('Please fix the errors', 'Order ID is required', 'destructive'); return; }
  if (!data.customerName) { toast('Please fix the errors', 'Customer name is required', 'destructive'); return; }

  if (state.formMode === 'create' && state.orders.some(o => o.orderId === data.orderId)) {
    toast('Could not create order', 'Order ID "' + data.orderId + '" already exists', 'destructive');
    return;
  }
  if (state.formMode === 'edit' && data.orderId !== state.formOrderId && state.orders.some(o => o.orderId === data.orderId)) {
    toast('Could not update order', 'Order ID "' + data.orderId + '" already exists', 'destructive');
    return;
  }

  ['quantity', 'unitPrice', 'clicheValue', 'totalValue', 'remainingQty'].forEach(k => {
    const n = Number(data[k]);
    data[k] = (data[k] === '' || isNaN(n)) ? null : n;
  });
  ['orderDate', 'deadline'].forEach(k => { data[k] = data[k] || null; });

  if (data.totalValue == null && data.quantity != null && data.unitPrice != null) {
    data.totalValue = data.quantity * data.unitPrice + (data.clicheValue || 0);
  }

  if (state.formMode === 'create') {
    createOrder(data);
    toast('Order created', data.orderId + ' has been added.');
  } else {
    updateOrder(state.formOrderId, data);

// ============================================================
// NAVIGATION / STATE ACTIONS
// ============================================================
function setView(view) {
  state.view = view;
  state.page = 1;
  state.itemPage = 1;
  render();
}
function setFilter(key, value) {
  state[key] = value;
  state.page = 1;
  render();
}
function clearFilters() {
  state.filterCustomer = ''; state.filterCustomerGroup = ''; state.filterProductType = ''; state.filterOrderType = '';
  state.filterProduction = ''; state.filterInvoice = ''; state.filterDelivery = '';
  state.page = 1;
  render();
}
function toggleFilters() {
  state.showFilters = !state.showFilters;
  render();
}
function toggleSort(field) {
  if (state.sortBy === field) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
  else { state.sortBy = field; state.sortDir = 'asc'; }
  render();
}
function toggleItemSort(field) {
  if (state.itemSort === field) state.itemSortDir = state.itemSortDir === 'asc' ? 'desc' : 'asc';
  else { state.itemSort = field; state.itemSortDir = field === 'description' || field === 'customer' || field === 'productType' ? 'asc' : 'desc'; }
  state.itemPage = 1;
  render();
}
function changePage(scope, delta) {
  if (scope === 'items') {
    state.itemPage = Math.max(1, state.itemPage + delta);
  } else {
    state.page = Math.max(1, state.page + delta);
  }
  render();
}
// Jump to the Orders tab showing every order in a customer group.
// Orders store the typed name, so this filters on the resolved group
// name rather than on the raw customer field.
function goToOrdersWithCustomer(customerName) {

}
function openOrderDetail(orderId) {

}
function closeOrderDetail() { state.selectedOrderId = null; render(); }
function openCreateForm() {

}
function openEditForm(orderId) {

function openCustomerDetail(name) { state.selectedCustomerName = name; render(); }

}

// ============================================================
// EVENT DELEGATION
// Data flows through data-* attributes, so no user-supplied text
// is ever interpolated into an inline handler.
// ============================================================
function handleDelegatedClick(e) {
  const backdrop = e.target.closest('.modal-backdrop[data-action]');
  if (backdrop && e.target === backdrop) {
    const a = backdrop.dataset.action;
    if (a === 'close-order-backdrop') return closeOrderDetail();
    if (a === 'close-form-backdrop') return closeForm();
    if (a === 'close-customer-backdrop') return closeCustomerDetail();
    if (a === 'close-customer-form-backdrop') return closeCustomerForm();
    if (a === 'close-merge-backdrop') return closeMergeModal();
    if (a === 'close-add-brand-backdrop') return closeAddBrand();
    if (a === 'close-item-backdrop') return closeItemHistory();
  }

  const el = e.target.closest('[data-action]');
  if (!el || el.classList.contains('modal-backdrop')) return;
  const action = el.dataset.action;

  switch (action) {
    case 'set-view':        return setView(el.dataset.view);
    case 'toggle-filters':  return toggleFilters();
    case 'clear-filters':   return clearFilters();
    case 'clear-group-filter': { state.filterCustomerGroup = ''; state.page = 1; return render(); }
    case 'sort':            return toggleSort(el.dataset.field);
    case 'sort-item':       return toggleItemSort(el.dataset.field);
    case 'page':            return changePage(el.dataset.scope, parseInt(el.dataset.delta, 10));
    case 'export-pdf':      return exportPDF();
    case 'new-order':       return openCreateForm();

    case 'open-order':      return openOrderDetail(el.dataset.orderId);
    case 'close-order':     return closeOrderDetail();
    case 'edit-order':      return openEditForm(el.dataset.orderId);
    case 'delete-order':    return confirmDeleteOrder(el.dataset.orderId);
    case 'close-form':      return closeForm();
    case 'save-form':       return saveForm();
    case 'use-last-price': {
      const formEl = document.getElementById('order-form');
      if (!formEl) return;
      const priceInput = formEl.querySelector('[name="unitPrice"]');
      if (!priceInput) return;
      priceInput.value = sanitizeDecimal(el.dataset.price);
      // Also carry over product type and unit, but only when still blank —
      // never overwrite something already chosen for this order.
      const productSel = formEl.querySelector('[name="productType"]');
      if (productSel && !productSel.value && el.dataset.product) productSel.value = el.dataset.product;
      const unitSel = formEl.querySelector('[name="qtyUnit"]');
      if (unitSel && el.dataset.unit && unitSel.value === 'PCS') unitSel.value = el.dataset.unit;
      recalcTotalValue();
      toast('Price applied', 'Unit price set to ' + formatSAR(Number(el.dataset.price)) + '.');
      return;
    }

    case 'open-customer':        return openCustomerDetail(el.dataset.customer);
    case 'close-customer':       return closeCustomerDetail();
    case 'edit-customer':        return openCustomerEditForm(el.dataset.customer);
    case 'close-customer-form':  return closeCustomerForm();
    case 'save-customer-form':   return saveCustomerForm();
    case 'customer-view-orders': { const n = el.dataset.customer; closeCustomerDetail(); return goToOrdersWithCustomer(n); }
    case 'customer-view-items':  return goToItemsWithCustomer(el.dataset.customer);

    case 'open-merge':        return openMergeModal(null);
    case 'rename-company':    return openRenameCompany(el.dataset.customer);
    case 'add-brand':         return openAddBrand(el.dataset.customer);
    case 'close-add-brand':   return closeAddBrand();
    case 'pick-brand':        return confirmAddBrand(el.dataset.customer, state.addBrandTo);
    case 'close-merge':       return closeMergeModal();
    case 'toggle-merge-pick': return toggleMergePick(el.dataset.customer);
    case 'use-merge-name':    { state.mergeTargetName = el.dataset.customer; return render(); }
    case 'confirm-merge': {
      const target = state.mergeTargetName.trim();
      // One selection is enough — naming a single-brand company is a rename.
      if (state.mergeSelected.length < 1 || !target) return;
      if (state.mergeSelected.length === 1 && normName(state.mergeSelected[0]) === normName(target)) {
        toast('Nothing to change', 'That is already the company name.');
        return closeMergeModal();
      }
      return showMergeConfirm(state.mergeSelected.slice(), target);
    }
    case 'toggle-suggestions': { state.showMergeSuggestions = !state.showMergeSuggestions; return render(); }
    case 'merge-from-suggestion': {
      const s = findDuplicateSuggestions()[parseInt(el.dataset.idx, 10)];
      if (s) openMergeModal(s.names);
      return;
    }
    case 'unmerge-alias': {
      const master = state.selectedCustomerName;
      return confirmUnmerge(el.dataset.alias, master);
    }

    case 'open-item':         return openItemHistory(el.dataset.itemKey);
    case 'close-item':        return closeItemHistory();
    case 'item-view-orders':  { const n = el.dataset.customer; closeItemHistory(); return goToOrdersWithCustomer(n); }
    case 'set-item-filter':   return;      // handled on 'change'
    case 'clear-item-filters': {
      state.itemFilterProduct = '';
      state.itemFilterCustomer = '';
      state.itemPage = 1;
      return render();
    }
    default: return;
  }
}

function handleDelegatedChange(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  if (el.dataset.action === 'set-filter') return setFilter(el.dataset.key, el.value);
  if (el.dataset.action === 'set-item-filter') {
    state[el.dataset.key] = el.value;
    state.itemPage = 1;
    return render();
  }
}

// Uppercase-as-you-type + numeric sanitising + live recalculation,
// all through one delegated input listener.
function handleDelegatedInput(e) {
  const el = e.target;
  if (!el || !el.tagName) return;

  if (el.dataset && el.dataset.upper === '1') upperOnInput(el);

  if (el.dataset && el.dataset.numeric === '1') {
    const cleaned = sanitizeDecimal(el.value);
    if (cleaned !== el.value) {
      const pos = el.selectionStart;
      el.value = cleaned;
      try { el.setSelectionRange(pos - 1 < 0 ? 0 : pos - 1, pos - 1 < 0 ? 0 : pos - 1); } catch (err) { /* ignore */ }
    }
  }

  const name = el.getAttribute && el.getAttribute('name');
  if (name === 'quantity' || name === 'unitPrice' || name === 'clicheValue') recalcTotalValue();
  if (name === 'customerName' || name === 'description') updateLastPriceHint();

  if (el.id === 'merge-search') { state.mergeSearch = el.value; scheduleRender('merge'); }
  if (el.id === 'add-brand-search') { state.addBrandSearch = el.value; scheduleRender('addBrand'); }
  if (el.id === 'merge-target') { state.mergeTargetName = el.value; scheduleRender('merge'); }
}

const _debounceTimers = {};
function scheduleRender(key, delay) {
  clearTimeout(_debounceTimers[key]);
  _debounceTimers[key] = setTimeout(() => render(), delay == null ? 260 : delay);
}

function attachEventListeners() {
  const searchInput = document.getElementById('search-input');
  if (searchInput && !searchInput.dataset.bound) {
    searchInput.dataset.bound = '1';
    searchInput.addEventListener('input', (e) => {
      state.search = e.target.value;
      state.page = 1;
      scheduleRender('search');
    });
  }
  const customerSearchInput = document.getElementById('customer-search-input');
  if (customerSearchInput && !customerSearchInput.dataset.bound) {
    customerSearchInput.dataset.bound = '1';
    customerSearchInput.addEventListener('input', (e) => {
      state.customerSearch = e.target.value;
      scheduleRender('customerSearch');
    });
  }
  const itemSearchInput = document.getElementById('item-search-input');
  if (itemSearchInput && !itemSearchInput.dataset.bound) {
    itemSearchInput.dataset.bound = '1';
    itemSearchInput.addEventListener('input', (e) => {
      state.itemSearch = e.target.value;
      state.itemPage = 1;
      scheduleRender('itemSearch');
    });
  }
  if (document.getElementById('order-form')) {
    recalcTotalValue();
    updateLastPriceHint();
  }
}

// ============================================================
// COMMAND PALETTE (Ctrl / Cmd + K)
// ============================================================
function isCmdOpen() {
  const el = document.getElementById('cmd-backdrop');
  return !!el && el.style.display === 'flex';
}
function openCmdPalette() {
  const backdrop = document.getElementById('cmd-backdrop');
  if (!backdrop) return;
  backdrop.style.display = 'flex';
  renderCmdResults('');
  const input = document.getElementById('cmd-input');
  if (input) setTimeout(() => input.focus(), 40);
}
function closeCmdPalette() {
  const backdrop = document.getElementById('cmd-backdrop');
  if (!backdrop) return;
  backdrop.style.display = 'none';
  const input = document.getElementById('cmd-input');
  if (input) input.value = '';
}

function renderCmdResults(query) {
  const container = document.getElementById('cmd-results');
  if (!container) return;
  const q = String(query || '').toLowerCase().trim();
  let html = '';

  const actions = [
    { icon: 'plus', label: 'Create new order', desc: 'Open the order form', run: () => { closeCmdPalette(); openCreateForm(); } },
    { icon: 'tags', label: 'Go to Items & Prices', desc: 'Look up any item price and date', run: () => { closeCmdPalette(); setView('items'); } },
    { icon: 'file-down', label: 'Export orders to PDF', desc: 'Download the filtered orders', run: () => { closeCmdPalette(); exportPDF(); } },
    { icon: 'building-2', label: 'Name a company', desc: 'Group brand names under one company', run: () => { closeCmdPalette(); setView('customers'); openMergeModal(null); } },
    { icon: 'sliders-horizontal', label: 'Toggle filters', desc: 'Show or hide the filter panel', run: () => { closeCmdPalette(); if (state.view !== 'orders') setView('orders'); else toggleFilters(); } },
    { icon: 'clipboard-list', label: 'Go to Orders', desc: 'Switch to the orders view', run: () => { closeCmdPalette(); setView('orders'); } },
    { icon: 'users', label: 'Go to Customers', desc: 'Switch to the customers view', run: () => { closeCmdPalette(); setView('customers'); } },
  ];

  const filteredActions = q ? actions.filter(a => a.label.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q)) : actions.slice(0, 5);

  let itemResults = [];
  let orderResults = [];
  if (q) {
    itemResults = buildItemIndex()
      .filter(i => i.description.toLowerCase().includes(q) || i.customer.toLowerCase().includes(q))
      .sort((a, b) => new Date(b.lastDate || 0) - new Date(a.lastDate || 0))
      .slice(0, 6);
    orderResults = state.orders.filter(o =>
      (o.orderId || '').toLowerCase().includes(q) ||
      (o.customerName || '').toLowerCase().includes(q) ||
      (o.description || '').toLowerCase().includes(q)
    ).slice(0, 6);
  } else {
    orderResults = state.orders.slice().sort((a, b) => new Date(b.orderDate || 0) - new Date(a.orderDate || 0)).slice(0, 5);
  }

  state.cmdSelectedIndex = 0;
  const allItems = [];

  if (filteredActions.length > 0) {
    html += '<p class="px-5 py-1 text-[10px] uppercase tracking-wider font-bold" style="color: var(--muted);">Quick actions</p>';
    filteredActions.forEach((a) => {
      allItems.push({ type: 'action', data: a });
      html += '<div class="cmd-result' + (allItems.length === 1 ? ' selected' : '') + '" data-idx="' + (allItems.length - 1) + '">' +
        '<div class="kpi-icon icon-primary shrink-0" style="width:32px;height:32px;border-radius:10px;"><i data-lucide="' + a.icon + '" class="w-4 h-4"></i></div>' +
        '<div class="flex-1 min-w-0"><div class="text-sm font-bold" style="color: var(--text);">' + esc(a.label) + '</div>' +
        '<div class="text-xs" style="color: var(--sub);">' + esc(a.desc) + '</div></div></div>';
    });
  }

  if (itemResults.length > 0) {
    html += '<p class="px-5 py-1 mt-2 text-[10px] uppercase tracking-wider font-bold" style="color: var(--muted);">Items &amp; prices</p>';
    itemResults.forEach((i) => {
      allItems.push({ type: 'item', data: i });
      html += '<div class="cmd-result" data-idx="' + (allItems.length - 1) + '">' +
        '<div class="kpi-icon icon-violet shrink-0" style="width:32px;height:32px;border-radius:10px;"><i data-lucide="tag" class="w-4 h-4"></i></div>' +
        '<div class="flex-1 min-w-0"><div class="text-sm font-bold truncate" style="color: var(--text);">' + esc(i.description) + '</div>' +
        '<div class="text-xs" style="color: var(--sub);">' + esc(i.customer) + ' · ' + (i.lastPrice != null ? formatSAR(i.lastPrice) : DASH) + ' · ' + formatDate(i.lastDate) + '</div></div></div>';
    });
  }

  if (orderResults.length > 0) {
    html += '<p class="px-5 py-1 mt-2 text-[10px] uppercase tracking-wider font-bold" style="color: var(--muted);">Orders</p>';
    orderResults.forEach((o) => {
      allItems.push({ type: 'order', data: o });
      html += '<div class="cmd-result" data-idx="' + (allItems.length - 1) + '">' +
        '<div class="kpi-icon icon-accent shrink-0" style="width:32px;height:32px;border-radius:10px;"><i data-lucide="clipboard-list" class="w-4 h-4"></i></div>' +
        '<div class="flex-1 min-w-0"><div class="text-sm font-bold truncate" style="color: var(--text);">' + esc(o.orderId) + ' · ' + esc(o.customerName) + '</div>' +
        '<div class="text-xs truncate" style="color: var(--sub);">' + esc(o.description || 'No description') + ' · ' + formatSARShort(o.totalValue) + '</div></div></div>';
    });
  }

  if (allItems.length === 0) {
    html = '<div class="px-5 py-8 text-center text-sm" style="color: var(--sub);">No results for "' + esc(query) + '"</div>';
  }

  container.innerHTML = html;
  container._allItems = allItems;

  container.querySelectorAll('.cmd-result').forEach(el => {
    el.addEventListener('click', () => runCmdItem(allItems[parseInt(el.dataset.idx, 10)]));
    el.addEventListener('mouseenter', () => {
      container.querySelectorAll('.cmd-result').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
      state.cmdSelectedIndex = parseInt(el.dataset.idx, 10);
    });
  });

  if (window.lucide) lucide.createIcons();
}

function runCmdItem(item) {
  if (!item) return;
  if (item.type === 'action') return item.data.run();
  closeCmdPalette();
  if (item.type === 'order') return openOrderDetail(item.data.orderId);
  if (item.type === 'item') { state.view = 'items'; return openItemHistory(item.data.key); }
}

function updateCmdSelection() {
  const container = document.getElementById('cmd-results');
  if (!container) return;
  container.querySelectorAll('.cmd-result').forEach(el => {
    el.classList.toggle('selected', parseInt(el.dataset.idx, 10) === state.cmdSelectedIndex);
  });
  const sel = container.querySelector('.cmd-result.selected');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}

// ============================================================
// KEYBOARD
// ============================================================
function handleKeydown(e) {
  if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
    e.preventDefault();
    return isCmdOpen() ? closeCmdPalette() : openCmdPalette();
  }

  if (isCmdOpen()) {
    const container = document.getElementById('cmd-results');
    const items = (container && container._allItems) || [];
    if (e.key === 'Escape') { e.preventDefault(); return closeCmdPalette(); }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      state.cmdSelectedIndex = Math.min(state.cmdSelectedIndex + 1, items.length - 1);
      return updateCmdSelection();
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      state.cmdSelectedIndex = Math.max(state.cmdSelectedIndex - 1, 0);
      return updateCmdSelection();
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      return runCmdItem(items[state.cmdSelectedIndex]);
    }
    return;
  }

  if (e.key === 'Escape') {
    // Close the top-most open layer.
    const transient = document.querySelector('.modal-backdrop:not([data-action])');
    if (transient) { transient.remove(); return; }
    if (state.selectedItemKey) return closeItemHistory();
    if (state.addBrandTo) return closeAddBrand();
    if (state.mergeOpen) return closeMergeModal();
    if (state.customerFormMode) return closeCustomerForm();
    if (state.formMode) return closeForm();
    if (state.selectedCustomerName) return closeCustomerDetail();
    if (state.selectedOrderId) return closeOrderDetail();
  }
}


// ============================================================
// PDF EXPORT — grouped by product type
// ============================================================
async function exportPDF() {
  if (state.isExportingPdf) return;

  const btn = document.getElementById('pdf-btn');
  const restoreBtn = () => {
    if (btn) btn.innerHTML = '<i data-lucide="file-down" class="w-4 h-4"></i><span>Export PDF</span>';
    if (window.lucide) lucide.createIcons();
  };

  if (!window.jspdf || !window.jspdf.jsPDF) {
    toast('PDF library still loading', 'Give it a second and try again.', 'destructive');
    return;
  }

  state.isExportingPdf = true;
  if (btn) btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 spin"></i> Generating...';
  if (window.lucide) lucide.createIcons();

  try {
    const filtered = getFilteredOrders();
    if (filtered.length === 0) {
      toast('Nothing to export', 'No orders match your current filters.', 'destructive');
      return;
    }

    const groups = {};
    for (const o of filtered) {
      const k = o.productType || 'Uncategorized';
      (groups[k] = groups[k] || []).push(o);
    }
    const groupArray = Object.entries(groups).map(([productType, orders]) => ({
      productType, orders,
      totalValue: orders.reduce((s, o) => s + (o.totalValue || 0), 0),
      orderCount: orders.length,
    })).sort((a, b) => b.totalValue - a.totalValue);

    const totalValue = filtered.reduce((s, o) => s + (o.totalValue || 0), 0);
    const totalCliche = filtered.reduce((s, o) => s + (o.clicheValue || 0), 0);

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const hasAutoTable = typeof doc.autoTable === 'function';
    if (!hasAutoTable) {
      toast('PDF table plugin missing', 'Reload the page and try again.', 'destructive');
      return;
    }

    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 14;
    const contentWidth = pageWidth - margin * 2;

    const PRIMARY = [27, 42, 74];
    const PRIMARY_DARK = [13, 17, 23];
    const ACCENT = [168, 129, 26];
    const TEXT = [22, 35, 61];
    const MUTED = [85, 96, 122];
    const BORDER = [229, 231, 235];
    const LIGHT_BG = [243, 244, 246];
    const WHITE = [255, 255, 255];

    const money = v => Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const now = new Date();
    const ts = now.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

    // Header band
    doc.setFillColor.apply(doc, PRIMARY_DARK);
    doc.rect(0, 0, pageWidth, 24, 'F');
    doc.setFillColor.apply(doc, PRIMARY);
    doc.roundedRect(margin, 4, 16, 16, 2, 2, 'F');
    doc.setTextColor.apply(doc, WHITE);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(13);
    doc.text('CG', margin + 8, 14.5, { align: 'center' });
    doc.setFontSize(15);
    doc.text('Century Gate Company Ltd', margin + 20, 12);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.text('Order Tracker - Filtered Orders Export', margin + 20, 18);
    doc.setFontSize(8);
    doc.text('Generated ' + ts, pageWidth - margin, 12, { align: 'right' });
    doc.text(filtered.length + ' orders - ' + groupArray.length + ' categories', pageWidth - margin, 18, { align: 'right' });

    let cursorY = 30;

    const kpiWidth = (contentWidth - 6) / 4;
    const kpis = [
      { label: 'TOTAL ORDERS', value: String(filtered.length), accent: PRIMARY },
      { label: 'TOTAL VALUE', value: 'SAR ' + money(totalValue), accent: ACCENT },
      { label: 'TOTAL CLICHE', value: 'SAR ' + money(totalCliche), accent: PRIMARY },
      { label: 'CATEGORIES', value: String(groupArray.length), accent: ACCENT },
    ];
    kpis.forEach((kpi, i) => {
      const x = margin + i * (kpiWidth + 2);
      doc.setFillColor.apply(doc, LIGHT_BG);
      doc.roundedRect(x, cursorY, kpiWidth, 16, 2, 2, 'F');
      doc.setTextColor.apply(doc, MUTED);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(7);
      doc.text(kpi.label, x + 3, cursorY + 5);
      doc.setTextColor.apply(doc, kpi.accent);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.text(kpi.value, x + 3, cursorY + 12);
    });
    cursorY += 22;

    const activeFilters = [];
    if (state.search) activeFilters.push('Search: ' + state.search);
    if (state.filterCustomerGroup) activeFilters.push('Customer group: ' + state.filterCustomerGroup);
    if (state.filterCustomer) activeFilters.push('Customer: ' + state.filterCustomer);
    if (state.filterProductType) activeFilters.push('Product Type: ' + state.filterProductType);
    if (state.filterOrderType) activeFilters.push('Order Type: ' + state.filterOrderType);
    if (state.filterProduction) activeFilters.push('Production: ' + state.filterProduction);
    if (state.filterInvoice) activeFilters.push('Invoice: ' + state.filterInvoice);
    if (state.filterDelivery) activeFilters.push('Delivery: ' + state.filterDelivery);

    if (activeFilters.length > 0) {
      doc.setTextColor.apply(doc, MUTED);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(7);
      doc.text('ACTIVE FILTERS', margin, cursorY + 1);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor.apply(doc, TEXT);
      const wrapped = doc.splitTextToSize(activeFilters.join('    -    '), contentWidth);
      doc.text(wrapped, margin, cursorY + 5);
      cursorY += 5 + wrapped.length * 4 + 4;
    } else {
      doc.setTextColor.apply(doc, MUTED);
      doc.setFont('helvetica', 'italic');
      doc.setFontSize(8);
      doc.text('No filters applied - showing all orders.', margin, cursorY + 4);
      cursorY += 12;
    }

    groupArray.forEach((group) => {
      if (cursorY + 30 > pageHeight - margin) { doc.addPage(); cursorY = margin; }

      doc.setFillColor.apply(doc, PRIMARY);
      doc.rect(margin, cursorY, contentWidth, 12, 'F');
      doc.setTextColor.apply(doc, WHITE);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      doc.text(group.productType, margin + 4, cursorY + 8);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.text(group.orderCount + ' orders   -   SAR ' + money(group.totalValue), pageWidth - margin - 4, cursorY + 8, { align: 'right' });
      cursorY += 14;

      const rows = group.orders.map(o => [
        o.customerNumber || '-',
        formatDate(o.orderDate),
        o.customerName || '-',
        o.description || '-',
        formatNumber(o.quantity) + (o.qtyUnit ? ' ' + o.qtyUnit : ''),
        o.unitPrice != null ? money(o.unitPrice) : '-',
        o.clicheValue != null ? money(o.clicheValue) : '-',
        o.totalValue != null ? money(o.totalValue) : '-',
        formatDate(o.deadline),
        o.productionStatus || '-',
      ]);

      doc.autoTable({
        startY: cursorY,
        head: [['Cust No', 'Order Date', 'Customer', 'Description', 'Quantity', 'Unit Price', 'Cliche', 'Total Value', 'Deadline', 'Production']],
        body: rows,
        theme: 'striped',
        headStyles: { fillColor: PRIMARY_DARK, textColor: WHITE, fontSize: 9, fontStyle: 'bold', halign: 'left', cellPadding: 2 },
        bodyStyles: { fontSize: 9, textColor: TEXT, cellPadding: 2, lineColor: BORDER, lineWidth: 0.1 },
        alternateRowStyles: { fillColor: LIGHT_BG },
        columnStyles: {
          0: { fontStyle: 'bold', textColor: PRIMARY },
          5: { halign: 'right' },
          6: { halign: 'right' },
          7: { halign: 'right', fontStyle: 'bold' },
        },
        tableWidth: 'auto',
        margin: { left: margin, right: margin, bottom: 14 },
        didDrawPage: function () {
          doc.setFontSize(7);
          doc.setTextColor.apply(doc, MUTED);
          doc.setFont('helvetica', 'normal');
          doc.text('Page ' + doc.internal.getNumberOfPages() + '   -   Century Gate Order Tracker   -   ' + ts, pageWidth / 2, pageHeight - 6, { align: 'center' });
        },
      });

      cursorY = doc.lastAutoTable.finalY + 10;
    });

    if (cursorY + 30 > pageHeight - margin) { doc.addPage(); cursorY = margin; } else { cursorY += 4; }
    doc.setFillColor.apply(doc, LIGHT_BG);
    doc.roundedRect(margin, cursorY, contentWidth, 22, 2, 2, 'F');
    doc.setTextColor.apply(doc, PRIMARY_DARK);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10);
    doc.text('Export Summary', margin + 4, cursorY + 6);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.setTextColor.apply(doc, TEXT);
    [
      'Total orders exported: ' + filtered.length,
      'Total value across all categories: SAR ' + money(totalValue),
      'Total cliche value: SAR ' + money(totalCliche),
      'Number of product categories: ' + groupArray.length,
    ].forEach((line, i) => doc.text(line, margin + 4, cursorY + 11 + i * 3));

    const filename = 'century-gate-orders-' + toDateInput(now) + '.pdf';
    const pdfBlob = doc.output('blob');

    let handled = false;
    if (navigator.share && navigator.canShare) {
      try {
        const pdfFile = new File([pdfBlob], filename, { type: 'application/pdf' });
        if (navigator.canShare({ files: [pdfFile] })) {
          await navigator.share({ files: [pdfFile], title: filename });
          handled = true;
        }
      } catch (shareErr) {
        // User dismissed the native share sheet — respect that, don't force a download.
        if (shareErr && shareErr.name === 'AbortError') handled = true;
      }
    }
    if (!handled) doc.save(filename);

    toast('PDF exported', filtered.length + ' orders across ' + groupArray.length + ' categor' + (groupArray.length === 1 ? 'y' : 'ies') + '.');
  } catch (e) {
    console.error('PDF export failed', e);
    toast('PDF export failed', e.message || 'An unexpected error occurred.', 'destructive');
  } finally {
    state.isExportingPdf = false;
    restoreBtn();
  }
}

// ============================================================
// INIT
// ============================================================
function init() {
  loadOrders();
  loadCustomerMasters();
  loadCustomerGroups();

  document.addEventListener('click', handleDelegatedClick);
  document.addEventListener('change', handleDelegatedChange);
  document.addEventListener('input', handleDelegatedInput);
  document.addEventListener('keydown', handleKeydown);

  const fab = document.getElementById('fab-new');
  if (fab) fab.addEventListener('click', openCreateForm);

  const cmdInput = document.getElementById('cmd-input');
  if (cmdInput) cmdInput.addEventListener('input', (e) => renderCmdResults(e.target.value));

  const cmdBackdrop = document.getElementById('cmd-backdrop');
  if (cmdBackdrop) cmdBackdrop.addEventListener('click', (e) => { if (e.target === cmdBackdrop) closeCmdPalette(); });

  render();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

</script>
